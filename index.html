:root{
  --chrome:#A9B3D1;--chrome2:#C4CBE2;--win:#EDEDF2;--win2:#E0E2EB;--ink:#1D1F2A;--muted:#596074;--line:#2B2E3B;--soft:#BCC1D0;
  --accent:#E8A33B;--accent-ink:#1d1405;--sel:#FCE3B8;--work:#666666;--strip:#F1EEEE;
  --chk1:#A8A8A8;--chk2:#C0C0C0;
  --checker:conic-gradient(var(--chk1) 25%,var(--chk2) 0 50%,var(--chk1) 0 75%,var(--chk2) 0) 0 0/8px 8px;
  --font:"Pixelify Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--chrome);color:var(--ink);font:14px/1.25 var(--font);overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{display:grid;height:100dvh;overflow:hidden;grid-template-rows:auto 1fr auto;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,select,input,textarea{font-family:var(--font)}
button{font-size:inherit;color:inherit}
.btn{height:36px;min-width:36px;padding:0 10px;border:1px solid var(--line);background:var(--win);color:var(--ink);border-radius:3px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;touch-action:manipulation;white-space:nowrap;flex:none;box-shadow:inset -1px -2px 0 rgba(0,0,0,.13)}
.btn:focus-visible,.field:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn:disabled{opacity:.38;cursor:default}
.btn[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);box-shadow:inset 1px 2px 0 rgba(0,0,0,.18)}
.btn.small{height:30px;min-width:30px;padding:0 8px;font-size:13px}
.btn.icon{padding:0;width:36px}
.btn.small.icon{width:30px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
svg.px{width:18px;height:18px;shape-rendering:crispEdges;fill:currentColor;display:block}
.top{display:flex;align-items:center;gap:6px;padding:5px 8px;background:var(--chrome);border-bottom:2px solid var(--line);overflow-x:auto;scrollbar-width:none}
.brand{font-size:13px;color:var(--ink);opacity:.75;white-space:nowrap;padding:0 4px}
.sep{width:2px;height:22px;background:var(--line);opacity:.35;margin:0 3px;flex:none}
.grow{flex:1}
.lbl{color:var(--muted);font-size:13px}
.val{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.hint{color:var(--muted);font-size:12px;margin:0;line-height:1.35}
.stage{position:relative;overflow:hidden;touch-action:none;background:var(--work)}
#view{position:absolute;inset:0;display:block;touch-action:none}
/* floating windows */
.win{position:absolute;z-index:10;background:var(--win);border:2px solid var(--line);border-radius:3px;box-shadow:3px 3px 0 rgba(0,0,0,.28);display:flex;flex-direction:column;max-height:calc(100% - 12px)}
.win[hidden]{display:none}
.win-bar,.ref-bar{display:flex;align-items:center;gap:4px;height:32px;padding:0 3px 0 6px;background:var(--chrome2);border-bottom:2px solid var(--line);cursor:grab;touch-action:none;font-size:13px;flex:none}
.win.collapsed .win-bar{border-bottom:0}
.win.collapsed .win-body{display:none}
.win-bar span,.ref-bar span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grip{width:12px;height:10px;flex:none;background:radial-gradient(circle,var(--line) 1.2px,transparent 1.4px) 0 0/4px 4px;opacity:.85}
.wbtn{height:24px;min-width:24px;padding:0 5px;border:1px solid var(--line);background:var(--win);border-radius:2px;cursor:pointer;font-size:12px;display:inline-flex;align-items:center;justify-content:center;touch-action:manipulation}
.wbtn svg.px{width:14px;height:14px}
.win-body{padding:8px;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:8px}
.tools-body{flex-direction:row;align-items:flex-start;gap:6px;padding:6px}
.tools{display:grid;grid-template-columns:40px;grid-auto-rows:40px;gap:4px;flex:none}
.tool{width:40px;height:40px;padding:0}
.tool svg.px{width:22px;height:22px}
.opts{display:flex;flex-direction:column;gap:6px;width:150px;border-left:2px solid var(--soft);padding-left:6px;align-self:stretch}
.opt-title{font-weight:600;font-size:14px}
.opts .grp{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.opts .grp .lbl{width:100%}
.opts>.btn{width:100%}
#winColor{width:248px}
#winPal{width:236px}
#winLayers{width:266px}
.colors{display:flex;gap:10px;align-items:flex-start}
.swatches{position:relative;width:58px;height:58px;flex:none}
.sw{position:absolute;width:38px;height:38px;border-radius:2px;border:2px solid var(--line);padding:0;cursor:pointer}
.sw.pri{left:0;top:0;z-index:2}
.sw.sec{right:0;bottom:0}
.colmeta{display:flex;flex-wrap:wrap;gap:5px;flex:1}
.field{height:30px;border:1px solid var(--line);border-radius:2px;background:#fff;color:var(--ink);font-size:14px;padding:0 7px;-webkit-user-select:text;user-select:text;min-width:0}
textarea.field{height:auto;padding:7px;resize:vertical}
#hex{width:100%;font-variant-numeric:tabular-nums}
.picker{display:flex;flex-direction:column;gap:6px}
#sv{width:100%;height:140px;border:2px solid var(--line);touch-action:none;display:block;cursor:crosshair}
#hue{width:100%;height:22px;border:2px solid var(--line);touch-action:none;display:block;cursor:pointer}
.sub{font-size:13px;color:var(--muted)}
.recent{display:flex;gap:4px;flex-wrap:wrap;min-height:22px}
.recent .pal{width:22px;height:22px;aspect-ratio:auto}
.palette{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.pal{aspect-ratio:1;border-radius:1px;border:1px solid var(--line);padding:0;cursor:pointer;touch-action:manipulation}
.pal.on{outline:2px solid var(--accent);outline-offset:1px;position:relative;z-index:1}
.row-btns{display:flex;flex-wrap:wrap;gap:4px}
.layers{display:flex;flex-direction:column;gap:3px;max-height:240px;overflow:auto}
.layer{display:flex;align-items:center;gap:3px;padding:2px;border-radius:2px;border:1px solid transparent}
.layer.on{background:var(--sel);border-color:var(--line)}
.layer .btn[aria-pressed=false] svg{opacity:.28}
.lname{flex:1;height:32px;text-align:left;border:0;background:transparent;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;padding:0 6px;touch-action:manipulation}
.op{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.op input{flex:1;accent-color:var(--accent)}
.op select{flex:1}
.prev-body{padding:8px;display:flex;justify-content:center;align-items:center;background:var(--win2)}
.prev-body canvas{image-rendering:pixelated;background:var(--checker);display:block;border:1px solid var(--line)}
/* timeline */
.time{background:var(--chrome);border-top:2px solid var(--line);display:flex;flex-direction:column;min-width:0}
.time-row{display:flex;align-items:center;flex-wrap:wrap;gap:4px 5px;padding:5px 8px;white-space:nowrap}
@media (max-width:900px){.time-row .sep{display:none}}
.time-row label{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--ink)}
.grp2{display:inline-flex;gap:0}
.grp2 .btn{border-radius:0;margin-left:-1px}
.grp2 .btn:first-child{border-radius:3px 0 0 3px;margin-left:0}
.grp2 .btn:last-child{border-radius:0 3px 3px 0}
.num{width:70px}
.frames-row{display:flex;align-items:center;gap:5px;padding:5px 8px;background:var(--strip);border-top:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
#tagSel{width:170px;height:30px;flex:none}
.strip{display:flex;gap:4px;overflow-x:auto;padding:2px;flex:1;min-width:0;scrollbar-width:thin}
.frame{position:relative;flex:none;width:46px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1px solid var(--line);border-radius:2px;background:#fff;color:var(--muted);font-size:11px;padding:3px;cursor:pointer;touch-action:manipulation;overflow:hidden}
.frame canvas{image-rendering:pixelated;background:var(--checker)}
.frame.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.tagbar{position:absolute;left:0;right:0;top:0;height:4px}
.status{display:flex;align-items:center;gap:12px;padding:3px 8px;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;overflow-x:auto;scrollbar-width:none}
.sbtn{border:0;background:transparent;padding:2px 4px;cursor:pointer;border-radius:2px;font-size:13px}
.sbtn:active{background:var(--chrome2)}
.zoomgrp{display:inline-flex;align-items:center}
/* dialogs */
.modal{position:fixed;inset:0;background:rgba(20,22,32,.4);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal[hidden]{display:none}
.sheet{background:var(--win);color:var(--ink);border:2px solid var(--line);border-radius:3px;box-shadow:4px 4px 0 rgba(0,0,0,.3);padding:16px;width:min(460px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:11px}
.sheet h2{margin:0;font-size:18px}
.sheet h3{margin:4px 0 0;font-size:14px;color:var(--muted);font-weight:600}
.sheet label{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet label.check{justify-content:flex-start}
.sheet label input[type=range]{flex:1;accent-color:var(--accent)}
.sheet p{margin:0;line-height:1.45}
.menu{display:flex;flex-direction:column;gap:5px}
.menu .btn{justify-content:flex-start}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.seg,.presets{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.seg [data-c][aria-pressed=true]{outline:3px solid var(--ink);outline-offset:2px}
.wh{display:flex;gap:12px;flex-wrap:wrap}
.preview{display:flex;flex-direction:column;gap:10px;align-items:center;padding-top:4px;border-top:1px solid var(--soft)}
.preview img,.txtprev{max-width:100%;max-height:260px;image-rendering:pixelated;background:var(--checker);-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.txtprev{align-self:flex-start;min-height:20px}
.pair{display:flex;align-items:center;gap:10px}
.pair i{width:34px;height:34px;border:2px solid var(--line);display:inline-block}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
.keys dt{font-weight:600;white-space:nowrap}
.keys dd{margin:0;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--line);color:#fff;padding:9px 13px;border-radius:3px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.loupe{position:fixed;width:72px;height:72px;border-radius:50%;pointer-events:none;z-index:70;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--line),0 6px 16px rgba(0,0,0,.35);overflow:hidden;display:none}
.loupe i{position:absolute;left:0;right:0;height:50%}
.loupe .now{top:0}.loupe .was{bottom:0}
.ref{position:absolute;z-index:5;background:var(--win);border:2px solid var(--line);border-radius:3px;box-shadow:3px 3px 0 rgba(0,0,0,.28);display:flex;flex-direction:column;overflow:hidden;min-width:190px}
.ref-body{position:relative;flex:1;overflow:hidden;touch-action:none;background:var(--checker)}
.ref-body img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;pointer-events:none}
.ref.min .ref-body,.ref.min .ref-grip{display:none}
.ref.min .ref-bar{border-bottom:0}
.ref-grip{position:absolute;right:0;bottom:0;width:28px;height:28px;touch-action:none;cursor:nwse-resize;background:linear-gradient(135deg,transparent 52%,var(--line) 52% 58%,transparent 58% 70%,var(--line) 70% 76%,transparent 76%)}
.anchor{display:grid;grid-template-columns:repeat(3,36px);gap:4px}
.anchor .btn{width:36px;height:36px;min-width:0;padding:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.sheet.wide{width:min(780px,100%)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.gcard{position:relative;display:flex;flex-direction:column;gap:5px;border:2px solid var(--line);background:var(--win2);border-radius:3px;padding:6px;min-width:0}
.gcard.on{outline:3px solid var(--accent);outline-offset:1px}
.gopen{border:0;background:none;padding:0;margin:0;font:inherit;color:inherit;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0;touch-action:manipulation}
.gth{height:100px;display:flex;align-items:center;justify-content:center;background:var(--checker);border:1px solid var(--line);overflow:hidden}
.gth img{max-width:100%;max-height:100%;image-rendering:pixelated;display:block}
.gcard b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gcard small{color:var(--muted);font-size:12px}
.gmore{position:absolute;right:10px;top:10px;background:var(--win)}
.gnew{align-items:center;justify-content:center;min-height:160px;cursor:pointer;border-style:dashed;background:transparent;font:inherit;color:inherit;touch-action:manipulation}
.gnew span{font-size:38px;line-height:1}
.namebtn{border:0;background:transparent;font-size:13px;color:var(--ink);opacity:.85;max-width:230px;min-width:48px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:6px 8px;border-radius:2px;cursor:pointer;flex:0 1 auto;touch-action:manipulation}
.namebtn:active{background:var(--chrome2)}
.stage.focus .win{display:none}
.sbtn[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.stsave{color:var(--muted);font-size:12px}
.stsave.bad{color:#b3261e;font-weight:600}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.pitem{height:auto;flex-direction:column;align-items:stretch;gap:5px;padding:7px 8px;text-align:left;justify-content:flex-start}
.pstrip{display:flex;flex-wrap:wrap}
.pstrip i{width:10px;height:10px;display:block}
.pstrip.big i{width:22px;height:22px}
.fine{color:var(--muted);font-size:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <button class="btn" id="galBtn">Галерея</button>
  <button class="btn" id="fileBtn">Файл</button>
  <button class="btn" id="editBtn">Правка</button>
  <button class="btn" id="viewBtn">Вид</button>
  <button class="btn" id="exportBtn">Экспорт</button>
  <button class="btn" id="refBtn">Референс</button>
  <span class="grow"></span>
  <span class="grp2">
    <button class="btn icon" id="undoBtn" aria-label="Отменить" title="Отменить (⌘Z)" data-icon="undo"></button>
    <button class="btn icon" id="redoBtn" aria-label="Повторить" title="Повторить (⇧⌘Z)" data-icon="redo"></button>
  </span>
  <button class="namebtn" id="nameBtn" title="Название работы. Нажми, чтобы переименовать">Пиксельня</button>
</header>

<main class="stage" id="stage"><canvas id="view"></canvas>
  <section class="win" id="winTools" aria-label="Инструменты">
    <div class="win-bar"><i class="grip"></i><span>Инструменты</span><button class="wbtn" data-collapse aria-label="Свернуть">–</button></div>
    <div class="win-body tools-body"><nav class="tools" id="tools" aria-label="Инструменты"></nav><div class="opts" id="opts"></div></div>
  </section>
  <section class="win" id="winPal" aria-label="Палитра">
    <div class="win-bar"><i class="grip"></i><span>Палитра</span><button class="wbtn" id="palMenu" aria-label="Готовые палитры и другое" title="Готовые палитры и другое">⋯</button><button class="wbtn" data-collapse aria-label="Свернуть">–</button></div>
    <div class="win-body"><div class="palette" id="palette"></div><p class="hint">Нажми на цвет, чтобы выбрать. Удержи, чтобы заменить или убрать. Готовые палитры: кнопка ⋯ сверху.</p><div class="sub">Недавние</div><div class="recent" id="recent"></div></div>
  </section>
  <section class="win" id="winPrev" aria-label="Предпросмотр">
    <div class="win-bar"><i class="grip"></i><span>Предпросмотр</span><button class="wbtn" data-a="sc" title="Масштаб">×2</button><button class="wbtn" data-a="play" aria-label="Проиграть анимацию"></button><button class="wbtn" data-collapse aria-label="Свернуть">–</button></div>
    <div class="win-body prev-body"><canvas id="prevCv"></canvas></div>
  </section>
  <section class="win" id="winColor" aria-label="Выбор цвета">
    <div class="win-bar"><i class="grip"></i><span>Выбор цвета</span><button class="wbtn" data-collapse aria-label="Свернуть">–</button></div>
    <div class="win-body">
      <div class="picker"><canvas id="sv" aria-label="Насыщенность и яркость"></canvas><canvas id="hue" aria-label="Оттенок"></canvas></div>
      <div class="colors">
        <div class="swatches">
          <button class="sw sec" id="swSec" title="Второй цвет. Нажми, чтобы поменять местами" aria-label="Второй цвет"></button>
          <button class="sw pri" id="swPri" title="Основной цвет" aria-label="Основной цвет"></button>
        </div>
        <div class="colmeta">
          <input id="hex" class="field" maxlength="7" spellcheck="false" autocomplete="off" aria-label="Код цвета">
          <button class="btn small" id="swapBtn" title="X">Поменять</button>
          <button class="btn small" id="addSw">В палитру</button>
        </div>
      </div>
    </div>
  </section>
  <section class="win" id="winLayers" aria-label="Слои">
    <div class="win-bar"><i class="grip"></i><span>Слои</span><button class="wbtn" data-collapse aria-label="Свернуть">–</button></div>
    <div class="win-body">
      <div class="row-btns">
        <button class="btn small" id="lAdd">Новый</button>
        <button class="btn small" id="lDup">Копия</button>
        <button class="btn small" id="lDel">Удалить</button>
        <button class="btn small icon" id="lUp" aria-label="Слой выше">↑</button>
        <button class="btn small icon" id="lDown" aria-label="Слой ниже">↓</button>
        <button class="btn small" id="lMerge">Слить вниз</button>

      <div class="layers" id="layers"></div>
      <label class="op">Непрозр. <input type="range" id="opacity" min="0" max="100"><span id="opVal"></span></label>
      <label class="op">Смешивание <select class="field" id="blend"></select></label>
      <p class="hint">Замок — рисовать только по нарисованному. Тап по выбранному слою — переименовать.</p>
    </div>
  </section>
</main>

<footer class="time">
  <div class="time-row">
    <span class="grp2">
      <button class="btn icon" id="fFirst" data-icon="first" aria-label="Первый кадр"></button>
      <button class="btn icon" id="fPrev" data-icon="prev" aria-label="Предыдущий кадр"></button>
      <button class="btn icon" id="playBtn" data-icon="play" aria-label="Проиграть" title="Enter"></button>
      <button class="btn icon" id="fNext" data-icon="next" aria-label="Следующий кадр"></button>
      <button class="btn icon" id="fLast" data-icon="last" aria-label="Последний кадр"></button>
    </span>
    <span class="sep"></span>
    <button class="btn small" id="fAdd">Кадр +</button>
    <button class="btn small" id="fDup">Копия</button>
    <button class="btn small" id="fDel">Удалить</button>
    <button class="btn small icon" id="fLeft" aria-label="Сдвинуть кадр влево">←</button>
    <button class="btn small icon" id="fRight" aria-label="Сдвинуть кадр вправо">→</button>
    <span class="sep"></span>
    <label>Длит. <input type="number" id="dur" class="field num" min="10" max="5000" step="10"> мс</label>
    <button class="btn small" id="durAll">Всем кадрам</button>
    <span class="grow"></span>
    <span class="grp2">
      <button class="btn icon" id="gridBtn" data-icon="grid" aria-pressed="true" aria-label="Сетка" title="Сетка"></button>

    <select class="field" id="tagSel" aria-label="Анимация"></select>
    <button class="btn small icon" id="tagNew" aria-label="Новый тег анимации" title="Новый тег">+</button>

    <span class="zoomgrp"><button class="sbtn" id="zoomOut" aria-label="Отдалить">−</button><button class="sbtn" id="zoomLbl" title="Вписать в экран">100%</button><button class="sbtn" id="zoomIn" aria-label="Приблизить">+</button></span>
    <span id="stFrames"></span><span id="stFps"></span><span id="metaPos"></span><span class="grow"></span><span id="stSave" class="stsave" role="status"></span><button class="sbtn" id="focusBtn" aria-pressed="false" title="Спрятать все окна и показать обратно (Tab)">Окна</button>
  </div>
</footer>

<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<input type="file" id="fileIn" hidden>

<script>
(()=>{

ICONS.redo=ICONS.undo.map(r=>[...r].reverse().join(''));ICONS.next=ICONS.prev.map(r=>[...r].reverse().join(''));ICONS.last=ICONS.first.map(r=>[...r].reverse().join(''));

const TOOLS=[
  {id:'pencil',name:'Карандаш',key:'B',code:'KeyB'},

  {id:'ellipse',name:'Эллипс',key:'O',code:'KeyO'},
  {id:'select',name:'Выделение',key:'M',code:'KeyM'},
  {id:'lasso',name:'Лассо',key:'Q',code:'KeyQ'},
  {id:'wand',name:'Волшебная палочка',key:'W',code:'KeyW'},
  {id:'move',name:'Перемещение',key:'V',code:'KeyV'},

];
const SELT=['select','lasso','wand'];
const KEEP_FLOAT=['select','lasso','wand','move','text','picker'];
const BLENDS=[['source-over','Обычный'],['multiply','Умножение'],['screen','Экран'],['overlay','Перекрытие'],['darken','Затемнение'],['lighten','Осветление'],['color-burn','Затемнение основы'],['color-dodge','Осветление основы'],['lighter','Добавление'],['hard-light','Жёсткий свет'],['soft-light','Мягкий свет'],['difference','Разница'],['exclusion','Исключение'],['hue','Цветовой тон'],['saturation','Насыщенность'],['color','Цветность'],['luminosity','Яркость']];
const TAGC=['#e0443a','#f2a33a','#e8d33f','#4cbf5a','#3a8de0','#8a5ae0','#e05aa8','#7a8494'];
const FONTS=[['Пиксельный 8px','"Press Start 2P"',8],['Пиксельный округлый','"Pixelify Sans"',12],['Обычный','system-ui,-apple-system,"Segoe UI",sans-serif',12],['С засечками','Georgia,"Times New Roman",serif',12]];
const DEFAULT_PAL=["#0f0f14","#2b2d42","#5c5f77","#9a9cb0","#d9dae3","#ffffff","#3b1f2b","#7a2e3a","#c2413b","#ee7a4a","#f6b26b","#fbe3a1","#1d3a2a","#2f6b3a","#5ba84a","#a6d15a","#16324f","#23629a","#3fa7d6","#9fe2f0","#3d2a5c","#6b3fa0","#b06ad1","#f0a6d8","#5a3a22","#8f5a2e","#c58b4f","#e9c28f"];

/* ---------- state ---------- */
const newLayer=name=>({name,visible:true,opacity:1,blend:'source-over',lockAlpha:false});
function makeDoc(w,h){return{w,h,layers:[newLayer('Слой 1')],frames:[{dur:100}],cels:[[new Uint8ClampedArray(w*h*4)]],tags:[]}}
let doc=makeDoc(32,32);
let palette=DEFAULT_PAL.slice(),palIdx=new Map();
let undoStack=[],redoStack=[];
let clip=null,selVer=0;
const st={layer:0,frame:0,tool:'pencil',size:1,pp:true,mx:false,my:false,filled:false,contig:true,shape:'sq',touch:'auto',focus:false,
  shade:0,dither:0,selMode:'new',sel:null,float:null,
  primary:[27,33,48,255],secondary:[255,255,255,255],zoom:8,panX:0,panY:0,grid:true,gridN:0,gridZ:20,bg:'chk',tile:false,onion:false,playing:false,activeTag:-1,ants:0,

const cel=(l=st.layer,f=st.frame)=>doc.cels[l][f];

const comp=document.createElement('canvas'),cctx=comp.getContext('2d',{willReadFrequently:true});
const tmp=document.createElement('canvas'),tctx=tmp.getContext('2d');
const oni=document.createElement('canvas'),octx=oni.getContext('2d');
const pcomp=document.createElement('canvas'),pctx=pcomp.getContext('2d');
function sizeAux(){for(const c of[comp,tmp,oni,pcomp]){c.width=doc.w;c.height=doc.h}if(st.sel&&st.sel.length!==doc.w*doc.h){st.sel=null;selVer++}}
function composite(f,ctx){
  ctx.clearRect(0,0,doc.w,doc.h);const F=st.float;
  doc.layers.forEach((L,l)=>{if(!L.visible||L.opacity<=0)return;
    tctx.putImageData(new ImageData(doc.cels[l][f],doc.w,doc.h),0,0);
    if(F&&F.l===l&&F.f===f)tctx.drawImage(F.canvas,F.x,F.y);

/* ---------- view ---------- */
const stage=$('#stage'),view=$('#view'),vctx=view.getContext('2d');
let dpr=1,VW=0,VH=0,hover=null,rq=false;
const accent=()=>getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
/* Фон под прозрачностью: как в Resprite/Aseprite, крупные клетки по 8×8 пикселей рисунка, #808080 и #C0C0C0.

function drawBg(ox,oy,dw,dh,z){
  const x1=Math.max(ox,0),y1=Math.max(oy,0),x2=Math.min(ox+dw,VW),y2=Math.min(oy+dh,VH);if(x2<=x1||y2<=y1)return;
  if(st.bg!=='chk'){vctx.fillStyle=BGC[st.bg]||BGC.light;vctx.fillRect(x1,y1,x2-x1,y2-y1);return}
  let cd=8;while(cd*z<16)cd*=2;const cs=cd*z;
  vctx.fillStyle='#808080';vctx.fillRect(x1,y1,x2-x1,y2-y1);vctx.fillStyle='#C0C0C0';
  const c0=Math.floor((x1-ox)/cs),c1=Math.ceil((x2-ox)/cs),r0=Math.floor((y1-oy)/cs),r1=Math.ceil((y2-oy)/cs);
  for(let r=r0;r<r1;r++)for(let c=c0;c<c1;c++){if(!((r+c)&1))continue;
    const a=Math.max(x1,Math.round(ox+c*cs)),b=Math.max(y1,Math.round(oy+r*cs)),e=Math.min(x2,Math.round(ox+(c+1)*cs)),f=Math.min(y2,Math.round(oy+(r+1)*cs));
    if(e>a&&f>b)vctx.fillRect(a,b,e-a,f-b)}
}
function resize(){const r=stage.getBoundingClientRect();dpr=window.devicePixelRatio||1;VW=r.width;VH=r.height;view.width=Math.round(VW*dpr);view.height=Math.round(VH*dpr);view.style.width=VW+'px';view.style.height=VH+'px';requestRender()}
new ResizeObserver(resize).observe(stage);
function requestRender(){if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;render()})}
function drawTinted(f,color,alpha,x0,y0,dw,dh){composite(f,octx);octx.globalCompositeOperation='source-atop';octx.globalAlpha=.55;octx.fillStyle=color;octx.fillRect(0,0,doc.w,doc.h);octx.globalCompositeOperation='source-over';octx.globalAlpha=1;vctx.globalAlpha=alpha;vctx.drawImage(oni,x0,y0,dw,dh);vctx.globalAlpha=1}
function maskPath(m,w,h){
  const p=new Path2D(),g=(x,y)=>x>=0&&y>=0&&x<w&&y<h&&m[y*w+x]===1;
  for(let y=0;y<=h;y++){let s=null;for(let x=0;x<=w;x++){const e=x<w&&g(x,y-1)!==g(x,y);if(e&&s===null)s=x;else if(!e&&s!==null){p.moveTo(s,y);p.lineTo(x,y);s=null}}}

  return p;
}
let antsC={k:null,p:null};
function antsPath(){
  let k,m,w,h,ox=0,oy=0;const F=st.float;
  if(F){k='f'+selVer;m=F.mask;w=F.w;h=F.h;ox=F.x;oy=F.y}
  else if(stroke&&stroke.prevMask){k='p'+stroke.pv;m=stroke.prevMask;w=doc.w;h=doc.h}
  else if(st.sel){k='s'+selVer;m=st.sel;w=doc.w;h=doc.h}else return null;

setInterval(()=>{if(st.sel||st.float||stroke?.prevMask){st.ants++;requestRender()}},140);
function render(){

  const tiles=st.tile?[-1,0,1]:[0];
  vctx.imageSmoothingEnabled=false;
  composite(st.frame,cctx);
  for(const ty of tiles)for(const tx of tiles)drawBg(x0+tx*dw,y0+ty*dh,dw,dh,z);
  const n=doc.frames.length;
  if(st.onion&&n>1&&!st.playing){drawTinted((st.frame-1+n)%n,'#e0443a',.4,x0,y0,dw,dh);if(n>2)drawTinted((st.frame+1)%n,'#3a8de0',.3,x0,y0,dw,dh)}

  const ga=clamp((z-(st.gridZ-8))/8,0,1);
  if(st.grid&&ga>0){
    vctx.beginPath();
    const xs=Math.max(0,Math.floor(-x0/z)),xe=Math.min(doc.w,Math.ceil((VW-x0)/z));
    const ys=Math.max(0,Math.floor(-y0/z)),ye=Math.min(doc.h,Math.ceil((VH-y0)/z));
    for(let x=xs;x<=xe;x++){const X=Math.round(x0+x*z)+.5;vctx.moveTo(X,y0);vctx.lineTo(X,y0+dh)}
    for(let y=ys;y<=ye;y++){const Y=Math.round(y0+y*z)+.5;vctx.moveTo(x0,Y);vctx.lineTo(x0+dw,Y)}
    vctx.strokeStyle=(st.bg==='black'||st.bg==='dark')?`rgba(255,255,255,${.22*ga})`:`rgba(0,0,0,${.24*ga})`;vctx.lineWidth=1;vctx.stroke();

    const ys=Math.max(1,Math.floor(-y0/z/N)),ye=Math.min(Math.ceil(doc.h/N)-1,Math.ceil((VH-y0)/z/N));
    for(let i=xs;i<=xe;i++){const X=Math.round(x0+i*N*z)+.5;vctx.moveTo(X,y0);vctx.lineTo(X,y0+dh)}
    for(let i=ys;i<=ye;i++){const Y=Math.round(y0+i*N*z)+.5;vctx.moveTo(x0,Y);vctx.lineTo(x0+dw,Y)}

    if(st.my){const Y=Math.round(y0+dh/2)+.5;vctx.moveTo(x0-8,Y);vctx.lineTo(x0+dw+8,Y)}
    vctx.lineWidth=3;vctx.strokeStyle='rgba(0,0,0,.35)';vctx.stroke();
    vctx.lineWidth=1;vctx.strokeStyle=accent();vctx.setLineDash([6,4]);vctx.stroke();vctx.restore()}
  vctx.strokeStyle=st.tile?accent():'#101010';vctx.lineWidth=1;vctx.strokeRect(Math.round(x0)-.5,Math.round(y0)-.5,Math.round(dw)+1,Math.round(dh)+1);
  if(stroke&&stroke.tool==='lasso'&&stroke.pts.length>1){
    vctx.save();vctx.setTransform(dpr*z,0,0,dpr*z,dpr*x0,dpr*y0);vctx.beginPath();
    stroke.pts.forEach(([px,py],i)=>i?vctx.lineTo(px+.5,py+.5):vctx.moveTo(px+.5,py+.5));
    vctx.lineWidth=2/z;vctx.strokeStyle=accent();vctx.stroke();vctx.restore();
  }
  const A=antsPath();
  if(A){vctx.save();vctx.setTransform(dpr*z,0,0,dpr*z,dpr*(x0+A.ox*z),dpr*(y0+A.oy*z));
    vctx.lineWidth=1.5/z;vctx.setLineDash([]);vctx.strokeStyle='#fff';vctx.stroke(A.p);
    vctx.setLineDash([4/z,4/z]);vctx.lineDashOffset=-(st.ants%8)/z;vctx.strokeStyle='#000';vctx.stroke(A.p);vctx.restore()}
  if(hover&&!st.playing&&!stroke){
    const s=['pencil','eraser','line','rect','ellipse'].includes(st.tool)?st.size:1,o=Math.floor((s-1)/2);
    vctx.strokeStyle=accent();vctx.lineWidth=1.5;
    if(st.shape==='round'&&s>2&&['pencil','eraser','line','rect','ellipse'].includes(st.tool)){
      vctx.save();vctx.setTransform(dpr*z,0,0,dpr*z,dpr*(x0+(hover.x-o)*z),dpr*(y0+(hover.y-o)*z));vctx.lineWidth=1.5/z;vctx.stroke(disk(s).path);vctx.restore()}
    else vctx.strokeRect(x0+(hover.x-o)*z+.75,y0+(hover.y-o)*z+.75,s*z-1.5,s*z-1.5);

const ZL=[.25,.5,1,2,3,4,6,8,10,12,16,20,24,32,48,64,96,128];
function zoomStep(d,cx=VW/2,cy=VH/2){let i=ZL.findIndex(v=>v>=st.zoom-1e-6);if(i<0)i=ZL.length-1;if(d>0)i=ZL[i]>st.zoom+1e-6?i:i+1;else i=i-1;zoomAt(ZL[clamp(i,0,ZL.length-1)],cx,cy)}

let P=null;

function mirrors(x,y){const p=[[x,y]];if(st.mx)p.push([doc.w-1-x,y]);if(st.my)p.push([x,doc.h-1-y]);if(st.mx&&st.my)p.push([doc.w-1-x,doc.h-1-y]);return p}

/* круглая кисть: тот же алгоритм, что у инструмента «Эллипс», заполненный */
const diskC=new Map();
function disk(s){let d=diskC.get(s);if(d)return d;

  const pts=[];for(let j=0;j<s;j++)for(let i=0;i<s;i++)if(m[j*s+i])pts.push([i,j]);

function brush(x,y,c){const s=st.size,o=Math.floor((s-1)/2);
  if(st.shape==='round'&&s>2){for(const[i,j]of disk(s).pts)plot(x-o+i,y-o+j,c);return}
  for(let j=0;j<s;j++)for(let i=0;i<s;i++)plot(x-o+i,y-o+j,c)}

function regionMask(d,x,y,contig,lim){

  if(fn.swap){F.x+=Math.floor((F.w-nw)/2);F.y+=Math.floor((F.h-nh)/2)}F.w=nw;F.h=nh;F.data=nd;F.mask=nm;buildFloatCanvas();selChanged()}
const rotCW=(x,y,w,h)=>[h-1-y,x];rotCW.swap=true;
const ACT={
  selall(){commitFloat();st.sel=new Uint8Array(doc.w*doc.h).fill(1);selChanged()},
  deselect(){commitFloat();st.sel=null;selChanged()},
  invert(){commitFloat();const m=new Uint8Array(doc.w*doc.h);for(let i=0;i<m.length;i++)m[i]=st.sel&&st.sel[i]?0:1;st.sel=m.some(v=>v)?m:null;selChanged()},
  copy(){const F=st.float;
    if(F)clip={w:F.w,h:F.h,data:F.data.slice(),mask:F.mask.slice(),x:F.x,y:F.y};
    else{const W=doc.w,m=st.sel||new Uint8Array(W*doc.h).fill(1),b=selBounds(m,W,doc.h);if(!b)return;const d=cel(),data=new Uint8ClampedArray(b.w*b.h*4),mask=new Uint8Array(b.w*b.h);
      for(let y=0;y<b.h;y++)for(let x=0;x<b.w;x++){const p=(b.y+y)*W+b.x+x;if(!m[p])continue;const q=y*b.w+x;mask[q]=1;data.set(d.subarray(p*4,p*4+4),q*4)}clip={w:b.w,h:b.h,data,mask,x:b.x,y:b.y}}
    toast('Скопировано');renderOptions()},
  del(){const F=st.float;
    if(F){st.float=null;const d=doc.cels[F.l][F.f];const m=new Uint8Array(doc.w*doc.h);for(let y=0;y<F.h;y++)for(let x=0;x<F.w;x++){const tx=F.x+x,ty=F.y+y;if(F.mask[y*F.w+x]&&tx>=0&&ty>=0&&tx<doc.w&&ty<doc.h)m[ty*doc.w+tx]=1}st.sel=m.some(v=>v)?m:null;
      if(!sameArr(d,F.before))pushUndo({type:'cel',l:F.l,f:F.f,before:F.before,after:d.slice()});selChanged();changed(true);return}
    if(!st.sel){toast('Сначала выдели область');return}
    const d=cel(),before=d.slice();for(let p=0;p<st.sel.length;p++)if(st.sel[p])d.fill(0,p*4,p*4+4);

  cut(){ACT.copy();ACT.del()},
  paste(){if(!clip){toast('Буфер пуст. Сначала скопируй');return}commitFloat();if(stopIfHidden())return;
    newFloat({x:clamp(clip.x,0,Math.max(0,doc.w-clip.w)),y:clamp(clip.y,0,Math.max(0,doc.h-clip.h)),w:clip.w,h:clip.h,data:clip.data.slice(),mask:clip.mask.slice()});
    if(!KEEP_FLOAT.includes(st.tool)||st.tool==='picker')setTool('move');toast('Вставлено. Перетащи на место')},
  flipH(){transformFloat((x,y,w)=>[w-1-x,y])},

function stopIfHidden(){if(!doc.layers[st.layer].visible){toast('Слой скрыт. Включи его, чтобы рисовать');return true}return false}

/* ---------- strokes ---------- */
let stroke=null;
function beginStroke(x,y,pointerId,ptype,opts){
  if(st.playing)stopPlay();
  const tool=opts.pick?'picker':st.tool;
  if(tool==='picker'){stroke={tool,pointerId,ptype,secondary:opts.secondary};pickAt(x,y,opts.secondary);return}
  if(SELT.includes(tool)||tool==='move'||tool==='text'){
    const mode=opts.mode||st.selMode;
    if((st.float||st.sel)&&mode==='new'&&(tool==='move'||insideSel(x,y))){
      if(!st.float&&!liftSelection())return;const F=st.float;
      stroke={tool:'floatmove',pointerId,ptype,start:[x,y],fx:F.x,fy:F.y,moved:false};return}
    if(tool==='text'){commitFloat();textDialog(x,y);return}
    if(tool==='move'){if(stopIfHidden())return;stroke={tool:'move',pointerId,ptype,l:st.layer,f:st.frame,before:cel().slice(),start:[x,y]};return}
    commitFloat();
    if(tool==='wand'){setSelection(regionMask(cel(),x,y,st.contig,null),mode);return}
    stroke={tool,pointerId,ptype,start:[x,y],last:[x,y],pts:[[x,y]],mode,pv:0,prevMask:null};
    if(tool==='select')selPreview(x,y);
    return;
  }
  commitFloat();
  if(stopIfHidden())return;
  const d=cel(),before=d.slice(),sec=!!opts.secondary;
  const color=tool==='eraser'?[0,0,0,0]:(sec?st.secondary:st.primary).slice();
  P=paintCtx(d,{dither:st.dither,shade:tool==='pencil'&&st.shade?st.shade*(sec?-1:1):0});
  stroke={tool,pointerId,ptype,l:st.layer,f:st.frame,before,color,start:[x,y],last:[x,y],pts:[[x,y]]};
  if(tool!=='eraser'&&!P.shade)pushRecent(color);
  if(tool==='pencil'||tool==='eraser')brush(x,y,color);
  else if(tool==='fill')floodFill(x,y,color);
  else shapeUpdate(x,y);
  changed();
}
function selPreview(x,y){stroke.last=[x,y];stroke.prevMask=rectMask(stroke.start[0],stroke.start[1],x,y);stroke.pv++;requestRender()}
function addPoint(x,y){
  const s=stroke,pts=s.pts,lp=pts[pts.length-1];if(lp[0]===x&&lp[1]===y)return;
  pts.push([x,y]);brush(x,y,s.color);
  if(st.pp&&st.size===1&&!P.dither&&pts.length>=3){const a=pts[pts.length-3],b=pts[pts.length-2],c=pts[pts.length-1];
    if(Math.abs(a[0]-c[0])===1&&Math.abs(a[1]-c[1])===1&&(b[0]===a[0]||b[1]===a[1])&&(b[0]===c[0]||b[1]===c[1])){restorePx(s.before,b[0],b[1]);pts.splice(pts.length-2,1)}}
}
function strokeMove(x,y){
  const s=stroke;if(!s)return;
  if(s.tool==='picker'){pickAt(x,y,s.secondary);return}
  if(s.tool==='floatmove'){const F=st.float;if(!F)return;const dx=x-s.start[0],dy=y-s.start[1];if(dx||dy)s.moved=true;F.x=s.fx+dx;F.y=s.fy+dy;requestRender();return}
  if(s.tool==='select'){if(s.last[0]!==x||s.last[1]!==y)selPreview(x,y);return}
  if(s.tool==='lasso'){const l=s.pts[s.pts.length-1];if(l[0]!==x||l[1]!==y){s.pts.push([x,y]);requestRender()}return}
  if(s.tool==='pencil'||s.tool==='eraser'){const[lx,ly]=s.last;if(lx===x&&ly===y)return;bres(lx,ly,x,y,(px,py)=>addPoint(px,py));s.last=[x,y]}
  else if(s.tool!=='fill')shapeUpdate(x,y);
  changed();
}
function shapeUpdate(x,y){
  const s=stroke,[sx,sy]=s.start,c=s.color;
  if(s.tool==='move'){const d=cel(s.l,s.f),dx=x-sx,dy=y-sy,w=doc.w,h=doc.h,b=s.before;d.fill(0);
    for(let yy=0;yy<h;yy++){let ty=yy+dy;if(st.tile)ty=((ty%h)+h)%h;if(ty<0||ty>=h)continue;for(let xx=0;xx<w;xx++){let tx=xx+dx;if(st.tile)tx=((tx%w)+w)%w;if(tx<0||tx>=w)continue;const si=(yy*w+xx)*4,di=(ty*w+tx)*4;d[di]=b[si];d[di+1]=b[si+1];d[di+2]=b[si+2];d[di+3]=b[si+3]}}return}
  P.d.set(s.before);
  if(s.tool==='line')bres(sx,sy,x,y,(px,py)=>brush(px,py,c));
  else if(s.tool==='rect'){const x0=Math.min(sx,x),x1=Math.max(sx,x),y0=Math.min(sy,y),y1=Math.max(sy,y);
    if(st.filled){for(let yy=y0;yy<=y1;yy++)for(let xx=x0;xx<=x1;xx++)plot(xx,yy,c)}
    else{for(let xx=x0;xx<=x1;xx++){brush(xx,y0,c);brush(xx,y1,c)}for(let yy=y0;yy<=y1;yy++){brush(x0,yy,c);brush(x1,yy,c)}}}
  else if(s.tool==='ellipse'){const pts=ellipsePts(sx,sy,x,y);
    if(st.filled){const rows=new Map();for(const[px,py]of pts){const r=rows.get(py);if(!r)rows.set(py,[px,px]);else{r[0]=Math.min(r[0],px);r[1]=Math.max(r[1],px)}}for(const[py,[a,b]]of rows)for(let px=a;px<=b;px++)plot(px,py,c)}
    else for(const[px,py]of pts)brush(px,py,c)}

function sameArr(a,b){if(a.length!==b.length)return false;for(let i=0;i<a.length;i++)if(a[i]!==b[i])return false;return true}
function endStroke(){
  const s=stroke;if(!s)return;stroke=null;if(s.loupe)hideLoupe();
  if(s.tool==='floatmove'){if(!s.moved&&SELT.includes(st.tool)){commitFloat();st.sel=null;selChanged()}else{renderOptions();requestRender()}return}
  if(s.tool==='select'){const[sx,sy]=s.start,[ex,ey]=s.last;if(sx===ex&&sy===ey&&s.mode==='new'){st.sel=null;selChanged();return}setSelection(rectMask(sx,sy,ex,ey),s.mode);return}
  if(s.tool==='lasso'){if(s.pts.length<3){if(s.mode==='new'){st.sel=null;selChanged()}else requestRender();return}setSelection(polyMask(s.pts),s.mode);return}
  P=null;
  if(s.before){const d=cel(s.l,s.f);if(!sameArr(d,s.before))pushUndo({type:'cel',l:s.l,f:s.f,before:s.before,after:d.slice()})}
  changed(true);

function cancelStroke(){
  const s=stroke;if(!s)return;stroke=null;if(s.loupe)hideLoupe();P=null;
  if(s.tool==='floatmove'){if(st.float){st.float.x=s.fx;st.float.y=s.fy}requestRender();return}
  if(s.before)cel(s.l,s.f).set(s.before);changed(true);

function pickAt(x,y,secondary){
  if(st.tile)[x,y]=wrap(x,y);
  if(x<0||y<0||x>=doc.w||y>=doc.h)return;composite(st.frame,cctx);
  const p=cctx.getImageData(x,y,1,1).data;if(p[3]===0)return;
  const c=[p[0],p[1],p[2],255];if(secondary)st.secondary=c;else st.primary=c;updateColorUI();
}

/* ---------- undo ---------- */
function snap(){return{w:doc.w,h:doc.h,layers:doc.layers.map(l=>({...l})),frames:doc.frames.map(f=>({...f})),tags:doc.tags.map(t=>({...t})),cels:doc.cels.map(r=>r.map(c=>c.slice())),layer:st.layer,frame:st.frame}}
function restoreSnap(s){const resized=s.w!==doc.w||s.h!==doc.h;doc={w:s.w,h:s.h,layers:s.layers.map(l=>({...l})),frames:s.frames.map(f=>({...f})),tags:s.tags.map(t=>({...t})),cels:s.cels.map(r=>r.map(c=>c.slice()))};st.layer=s.layer;st.frame=s.frame;sizeAux();if(resized)fitView()}
const UNDO_CAP=160*1024*1024;
function entryBytes(e){if(e.bytes==null){if(e.type==='cel')e.bytes=e.before.length+e.after.length;else{let n=0;for(const k of['before','after'])for(const r of e[k].cels)for(const c of r)n+=c.length;e.bytes=n}}return e.bytes}
/* история хранится в памяти: ограничиваем и числом шагов, и объёмом, чтобы большие рисунки не валили вкладку */
function pushUndo(e){undoStack.push(e);redoStack.length=0;let tot=0;for(const x of undoStack)tot+=entryBytes(x);
  while(undoStack.length>1&&(undoStack.length>80||tot>UNDO_CAP))tot-=entryBytes(undoStack.shift());updateUndoUI()}
function docOp(fn){if(st.playing)stopPlay();commitFloat();const before=snap();fn();pushUndo({type:'doc',before,after:snap()});structureChanged()}
function applyEntry(e,which){if(e.type==='cel'){doc.cels[e.l][e.f].set(e[which]);st.layer=e.l;st.frame=e.f}else restoreSnap(e[which]);structureChanged()}
function undo(){if(stroke)return;commitFloat();const e=undoStack.pop();if(!e){toast('Отменять нечего');return}applyEntry(e,'before');redoStack.push(e);updateUndoUI()}
function redo(){if(stroke)return;commitFloat();const e=redoStack.pop();if(!e)return;applyEntry(e,'after');undoStack.push(e);updateUndoUI()}
function updateUndoUI(){$('#undoBtn').disabled=!undoStack.length;$('#redoBtn').disabled=!redoStack.length}

/* ---------- change propagation ---------- */
let thumbTimer=null;
function changed(final){requestRender();const f=stroke&&stroke.f!=null?stroke.f:st.frame;if(final){drawThumb(f);scheduleAutosave()}else if(!thumbTimer)thumbTimer=setTimeout(()=>{thumbTimer=null;drawThumb(f)},120)}
function structureChanged(){st.layer=clamp(st.layer,0,doc.layers.length-1);st.frame=clamp(st.frame,0,doc.frames.length-1);if(st.activeTag>=doc.tags.length)st.activeTag=-1;renderLayers();renderFrames();renderTags();frameSelected();updateUndoUI();updateMeta();requestRender();scheduleAutosave()}
function updateMeta(){$('#sizeBtn').textContent=`${doc.w}×${doc.h}`;$('#stFrames').textContent=`Кадр ${st.frame+1} / ${doc.frames.length}`;$('#stFps').textContent=`FPS ${Math.round(1000/(doc.frames[st.frame]?.dur||100))}`;$('#metaPos').textContent=hover&&hover.x>=0&&hover.y>=0&&hover.x<doc.w&&hover.y<doc.h?`${hover.x}, ${hover.y}`:''}

/* ---------- tools UI ---------- */
const toolsEl=$('#tools');
TOOLS.forEach(t=>{const b=document.createElement('button');b.className='btn tool';b.dataset.tool=t.id;b.setAttribute('aria-label',t.name);b.title=`${t.name} (${t.key})`;b.innerHTML=icon(t.id);b.onclick=()=>setTool(t.id);toolsEl.append(b)});
function setTool(id){if(!KEEP_FLOAT.includes(id))commitFloat();st.tool=id;toolsEl.querySelectorAll('.tool').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tool===id));renderOptions();requestRender()}
function setSize(n){st.size=clamp(n,1,32);const v=$('#sizeVal');if(v)v.textContent=st.size;requestRender()}
function renderOptions(){
  const t=st.tool,T=TOOLS.find(x=>x.id===t);let h=`<span class="opt-title">${T.name}</span>`;
  const chip=(k,label)=>`<button class="btn small" data-chip="${k}" aria-pressed="${st[k]}">${label}</button>`;
  const seg=(k,label,items)=>`<span class="grp"><span class="lbl">${label}</span>${items.map(([v,l])=>`<button class="btn small" data-k="${k}" data-v="${v}" aria-pressed="${st[k]===v}">${l}</button>`).join('')}</span>`;
  const act=(a,l,dis)=>`<button class="btn small" data-act="${a}" ${dis?'disabled':''}>${l}</button>`;
  const sz=`<span class="grp"><span class="lbl">Размер</span><button class="btn small icon" data-act="size-" aria-label="Меньше">−</button><span class="val" id="sizeVal">${st.size}</span><button class="btn small icon" data-act="size+" aria-label="Больше">+</button></span>`;
  const dith=seg('dither','Дизеринг',[[0,'Нет'],[1,'50%'],[2,'25%']]);
  const mir=chip('mx','Зеркало ↔')+chip('my','Зеркало ↕');
  const shp=seg('shape','Кисть',[['sq','Квадрат'],['round','Круг']]);
  if(t==='pencil')h+=sz+shp+chip('pp','Пиксель-перфект')+seg('shade','Затенение',[[0,'Нет'],[-1,'Темнее'],[1,'Светлее']])+dith+mir;
  if(t==='eraser')h+=sz+shp+chip('pp','Пиксель-перфект')+dith+mir;
  if(t==='line')h+=sz+shp+dith+mir;
  if(t==='rect'||t==='ellipse')h+=sz+shp+chip('filled','С заливкой')+dith+mir;
  if(t==='fill')h+=chip('contig','Только смежные')+dith;
  if(t==='picker')h+=`<p class="hint">Берёт цвет с холста. Ещё можно просто удержать палец на холсте с любым инструментом.</p>`;
  if(SELT.includes(t)){h+=seg('selMode','',[['new','Новое'],['add','Добавить'],['sub','Вычесть']]);if(t==='wand')h+=chip('contig','Только смежные')}
  if(t==='move'&&!st.float&&!st.sel)h+=`<p class="hint">Двигает весь слой. Если есть выделение — двигает только его.</p>`;
  if(t==='text'&&!st.float)h+=`<p class="hint">Нажми на холст там, где должен начаться текст.</p>`;
  if(SELT.includes(t)||t==='move'||t==='text'){
    const has=!!(st.sel||st.float);
    if(SELT.includes(t))h+=act('selall','Всё')+act('deselect','Снять',!has)+act('invert','Инверсия');
    if(has)h+=act('copy','Копировать')+act('cut','Вырезать')+act('del','Удалить')+act('flipH','Отразить ↔')+act('flipV','Отразить ↕')+act('rot','Повернуть ↻');
    if(clip)h+=act('paste','Вставить');
    if(st.float)h+=`<button class="btn small primary" data-act="commit">Готово</button>`;
  }
  if(t==='pencil'&&st.shade)h+=`<p class="hint">Затенение сдвигает цвет пикселя на соседний в палитре.</p>`;
  $('#opts').innerHTML=h;
}
$('#opts').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
  const a=b.dataset.act;
  if(a==='size-')setSize(st.size-1);else if(a==='size+')setSize(st.size+1);
  else if(a&&ACT[a])ACT[a]();
  else if(b.dataset.chip){const k=b.dataset.chip;st[k]=!st[k];b.setAttribute('aria-pressed',st[k])}
  else if(b.dataset.k){const k=b.dataset.k,v=b.dataset.v;st[k]=isNaN(+v)?v:+v;if(k==='shape')saveUI();renderOptions()}});

/* ---------- colors & palette ---------- */
const hexOf=c=>'#'+[c[0],c[1],c[2]].map(v=>v.toString(16).padStart(2,'0')).join('');
const rgbOf=h=>{const m=/^#?([0-9a-f]{6})$/i.exec(String(h).trim());if(!m)return null;const n=parseInt(m[1],16);return[n>>16&255,n>>8&255,n&255,255]};
let hsv={h:0,s:0,v:0};
function rgbToHsv(c){const r=c[0]/255,g=c[1]/255,b=c[2]/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}return{h,s:mx?d/mx:0,v:mx}}
function hsvToRgb({h,s,v}){const f=n=>{const k=(n+h/60)%6;return Math.round(255*(v-v*s*Math.max(0,Math.min(k,4-k,1))))};return[f(5),f(3),f(1),255]}
function syncHsv(){const n=rgbToHsv(st.primary);if(n.s===0||n.v===0)n.h=hsv.h;if(n.v===0)n.s=hsv.s;hsv=n}
const svC=$('#sv'),hueC=$('#hue');
function fitCanvas(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1,w=Math.max(1,Math.round(r.width*d)),h=Math.max(1,Math.round(r.height*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h}return[w,h,d]}
function drawPicker(){
  let[w,h,d]=fitCanvas(svC),x=svC.getContext('2d'),g;
  x.fillStyle=`hsl(${hsv.h},100%,50%)`;x.fillRect(0,0,w,h);
  g=x.createLinearGradient(0,0,w,0);g.addColorStop(0,'#fff');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,w,h);
  g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'#000');x.fillStyle=g;x.fillRect(0,0,w,h);
  const mx=hsv.s*w,my=(1-hsv.v)*h;
  x.lineWidth=2*d;x.strokeStyle='#fff';x.beginPath();x.arc(mx,my,6*d,0,7);x.stroke();
  x.lineWidth=d;x.strokeStyle='rgba(0,0,0,.6)';x.beginPath();x.arc(mx,my,7.5*d,0,7);x.stroke();
  [w,h,d]=fitCanvas(hueC);x=hueC.getContext('2d');g=x.createLinearGradient(0,0,w,0);
  for(let i=0;i<=6;i++)g.addColorStop(i/6,`hsl(${i*60},100%,50%)`);x.fillStyle=g;x.fillRect(0,0,w,h);
  const hx=hsv.h/360*w;x.fillStyle='#fff';x.fillRect(hx-2*d,0,4*d,h);x.lineWidth=d;x.strokeStyle='rgba(0,0,0,.6)';x.strokeRect(hx-2.5*d,.5*d,5*d,h-d);
}
function dragOn(el,fn){el.addEventListener('pointerdown',e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch{}fn(e);
  const mv=ev=>{if(ev.pointerId===e.pointerId)fn(ev)},up=ev=>{if(ev.pointerId!==e.pointerId)return;el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up)};
  el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)})}
dragOn(svC,e=>{const r=svC.getBoundingClientRect();hsv.s=clamp((e.clientX-r.left)/r.width,0,1);hsv.v=clamp(1-(e.clientY-r.top)/r.height,0,1);st.primary=hsvToRgb(hsv);updateColorUI(true)});

  if(e.code==='Delete'||e.code==='Backspace'){if(st.sel||st.float){e.preventDefault();ACT.del()}return}
  if(e.code==='Escape'){if(st.float)commitFloat();else if(st.sel)ACT.deselect();return}
  if(e.code==='Enter'&&st.float){commitFloat();return}
  if(e.shiftKey&&e.code==='KeyH'){ACT.flipH();return}
  if(e.shiftKey&&e.code==='KeyV'){ACT.flipV();return}
  const t=TOOLS.find(t=>t.code===e.code);if(t){setTool(t.id);return}
  switch(e.code){
    case'KeyX':swapColors();break;case'BracketLeft':setSize(st.size-1);break;case'BracketRight':setSize(st.size+1);break;
    case'Comma':goFrame(-1);break;case'Period':goFrame(1);break;case'Enter':togglePlay();break;
    case'Equal':case'NumpadAdd':zoomStep(1);break;case'Minus':case'NumpadSubtract':zoomStep(-1);break;case'Digit0':fitView();break;
  }
});

async function textMask(o){
  const fam=FONTS[o.font][1],size=o.size;try{await document.fonts.load(`${size}px ${fam}`,o.text)}catch{}
  const lines=o.text.split('\n'),c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});
  x.font=`${size}px ${fam}`;const lh=Math.ceil(size*1.3),pad=Math.ceil(size/2);
  const W=Math.ceil(Math.max(1,...lines.map(l=>x.measureText(l).width)))+pad*2,H=lh*lines.length+pad*2;
  c.width=W;c.height=H;x.font=`${size}px ${fam}`;x.textBaseline='top';x.fillStyle='#000';lines.forEach((l,i)=>x.fillText(l,pad,pad+i*lh));
  const d=x.getImageData(0,0,W,H).data,m=new Uint8Array(W*H);for(let p=0;p<m.length;p++)m[p]=d[p*4+3]>=128?1:0;
  const b=selBounds(m,W,H);if(!b)return null;const out=new Uint8Array(b.w*b.h);
  for(let y=0;y<b.h;y++)for(let xx=0;xx<b.w;xx++)out[y*b.w+xx]=m[(b.y+y)*W+b.x+xx];return{w:b.w,h:b.h,mask:out};
}

    frames.push(new BW().u32(bb.length+16).u16(0xF1FA).u16(Math.min(chunks.length,0xFFFF)).u16(D.frames[f].dur||100).zeros(2).u32(chunks.length).bytes(bb).out());
  }
  let total=128;for(const f of frames)total+=f.length;

  h.u32(total).u16(0xA5E0).u16(nF).u16(W).u16(H).u16(32).u32(1).u16(D.frames[0].dur||100).u32(0).u32(0).u8(0).zeros(3).u16(Math.min(pal.length,65535)).u8(1).u8(1).u16(0).u16(0).u16(16).u16(16).zeros(84);
  if(h.n!==128)throw new Error('header size '+h.n);
  const all=new BW();all.bytes(h.out());for(const f of frames)all.bytes(f);

}

function buildRef(R){
  const el=document.createElement('div');el.className='ref'+(R.min?' min':'');
  el.innerHTML=`<div class="ref-bar"><span>Референс</span><button class="btn small" data-a="op" title="Прозрачность окна">${Math.round(R.op*100)}%</button><button class="btn small" data-a="fit">Вписать</button><button class="btn small icon" data-a="min" aria-label="Свернуть">–</button><button class="btn small icon" data-a="x" aria-label="Убрать референс">×</button></div><div class="ref-body"></div><div class="ref-grip" aria-hidden="true"></div>`;
  R.el=el;R.body=el.querySelector('.ref-body');R.img.width=R.iw;R.img.height=R.ih;R.img.alt='';R.body.append(R.img);stage.append(el);
  el.addEventListener('pointerdown',e=>e.stopPropagation());
  el.addEventListener('wheel',e=>{e.preventDefault();e.stopPropagation();const r=R.body.getBoundingClientRect();zoomRef(R,R.z*Math.exp(-e.deltaY*.01),e.clientX-r.left,e.clientY-r.top)},{passive:false});
  const bar=el.querySelector('.ref-bar');
  bar.addEventListener('click',e=>{const a=e.target.closest('button')?.dataset.a;if(!a)return;
    if(a==='op'){R.op=R.op>.9?.6:R.op>.5?.3:1;e.target.closest('button').textContent=Math.round(R.op*100)+'%'}
    else if(a==='fit'){R.z=1;R.px=R.py=0;if(R.min){R.min=false;el.classList.remove('min')}}
    else if(a==='min'){R.min=!R.min;el.classList.toggle('min',R.min)}
    else if(a==='x'){el.remove();refs.splice(refs.indexOf(R),1);saveRefs();return}
    placeRef(R);layoutRef(R);saveRefs()});
  track(bar,e=>!e.target.closest('button')&&{x0:R.x,y0:R.y,sx:e.clientX,sy:e.clientY},(e,s)=>{R.x=s.x0+e.clientX-s.sx;R.y=s.y0+e.clientY-s.sy;placeRef(R)},saveRefs);
  track(el.querySelector('.ref-grip'),e=>({w0:R.w,h0:R.h,sx:e.clientX,sy:e.clientY}),(e,s)=>{R.w=Math.max(190,s.w0+e.clientX-s.sx);R.h=Math.max(110,s.h0+e.clientY-s.sy);placeRef(R);layoutRef(R)},saveRefs);
  const bp=new Map();let pinch=null,holdT=null,picking=null;
  const body=R.body,loc=e=>{const r=body.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
  body.addEventListener('pointerdown',e=>{e.preventDefault();try{body.setPointerCapture(e.pointerId)}catch{}
    const p=loc(e);bp.set(e.pointerId,{...p,sx:p.x,sy:p.y,px0:R.px,py0:R.py});clearTimeout(holdT);
    if(bp.size===2){const[a,b]=[...bp.values()];picking=null;hideLoupe();pinch={d0:Math.hypot(a.x-b.x,a.y-b.y)||1,z0:R.z,m:{x:(a.x+b.x)/2,y:(a.y+b.y)/2}};return}
    if(bp.size>2)return;
    if(st.tool==='picker'||e.pointerType==='mouse'&&e.altKey){picking=e.pointerId;pickRef(R,e.clientX,e.clientY,hexOf(st.primary));return}
    const was=hexOf(st.primary);holdT=setTimeout(()=>{if(bp.has(e.pointerId)&&bp.size===1){picking=e.pointerId;const q=bp.get(e.pointerId),r=body.getBoundingClientRect();pickRef(R,r.left+q.x,r.top+q.y,was)}},420)});
  body.addEventListener('pointermove',e=>{const q=bp.get(e.pointerId);if(!q)return;const p=loc(e);q.x=p.x;q.y=p.y;
    if(pinch&&bp.size>=2){const[a,b]=[...bp.values()],d=Math.hypot(a.x-b.x,a.y-b.y)||1,m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
      const ix=(pinch.m.x-R.tx)/R.s,iy=(pinch.m.y-R.ty)/R.s;zoomRef(R,pinch.z0*d/pinch.d0,null,null,{ix,iy,mx:m.x,my:m.y});pinch.m=m;pinch.z0=R.z;pinch.d0=d;return}
    if(picking===e.pointerId){pickRef(R,e.clientX,e.clientY);return}
    if(Math.hypot(p.x-q.sx,p.y-q.sy)>8)clearTimeout(holdT);
    if(bp.size===1){R.px=q.px0+p.x-q.sx;R.py=q.py0+p.y-q.sy;layoutRef(R)}});
  const up=e=>{if(!bp.delete(e.pointerId))return;clearTimeout(holdT);if(picking===e.pointerId){picking=null;hideLoupe()}
    if(bp.size<2&&pinch){pinch=null;for(const q of bp.values()){q.sx=q.x;q.sy=q.y;q.px0=R.px;q.py0=R.py}}saveRefs()};
  body.addEventListener('pointerup',up);body.addEventListener('pointercancel',up);
  new ResizeObserver(()=>layoutRef(R)).observe(body);
  placeRef(R);layoutRef(R);
}
function zoomRef(R,z,cx,cy,anc){z=clamp(z,.2,60);const bw=R.body.clientWidth,bh=R.body.clientHeight,fit=Math.min(bw/R.iw,bh/R.ih);
  let ix,iy,mx,my;if(anc)({ix,iy,mx,my}=anc);else{ix=(cx-R.tx)/R.s;iy=(cy-R.ty)/R.s;mx=cx;my=cy}
  R.z=z;const s=fit*z;R.px=mx-ix*s-(bw-R.iw*s)/2;R.py=my-iy*s-(bh-R.ih*s)/2;layoutRef(R);saveRefs()}

const WINS=[['winTools','Инструменты'],['winColor','Выбор цвета'],['winPal','Палитра'],['winLayers','Слои'],['winPrev','Предпросмотр']];
const WS={};let winZ=10;
const winEl=id=>document.getElementById(id);
function defaultWins(){
  const S=stage.getBoundingClientRect(),tw=winEl('winTools').offsetWidth||230,cw=winEl('winColor').offsetWidth||252,lw=winEl('winLayers').offsetWidth||256;
  const ch=WS.winColor&&!WS.winColor.col?(winEl('winColor').offsetHeight||300):300;
  return{winTools:{x:8,y:8,side:'l',ro:8},winPal:{x:tw+14,y:8,col:true,side:'l',ro:8},winPrev:{x:tw+14,y:46,col:true,side:'l',ro:8},winColor:{x:S.width-cw-8,y:8,side:'r',ro:8},winLayers:{x:S.width-lw-8,y:ch+16,side:'r',ro:8}};
}
/* Окно целиком держится в видимой области. Окна у правого края «прилипают» к нему при повороте экрана. */
function placeWin(id){
  const el=winEl(id),s=WS[id];if(!s)return;el.hidden=!!s.hid;if(s.hid){if(id==='winPrev')syncPrev();return}
  el.classList.toggle('collapsed',!!s.col);el.querySelector('[data-collapse]').textContent=s.col?'+':'–';
  const S=stage.getBoundingClientRect(),w=el.offsetWidth,h=el.offsetHeight;
  if(s.side==='r'&&s.ro!=null)s.x=S.width-w-s.ro;
  s.x=clamp(s.x,0,Math.max(0,S.width-w));s.y=clamp(s.y,0,Math.max(0,S.height-h));el.style.left=s.x+'px';el.style.top=s.y+'px';
  if(id==='winPrev')syncPrev();
}
function anchorWin(id){const s=WS[id],el=winEl(id),S=stage.getBoundingClientRect(),w=el.offsetWidth;s.side=(s.x+w/2>S.width/2)?'r':'l';s.ro=Math.max(0,Math.round(S.width-s.x-w))}
function resetWins(){for(const[id]of WINS){WS[id]={col:false,hid:false}}const d=defaultWins();for(const[id]of WINS){WS[id]={hid:false,col:false,...d[id]};placeWin(id)}const d2=defaultWins();WS.winLayers.y=d2.winLayers.y;placeWin('winLayers')}
function initWins(saved){
  for(const[id]of WINS){WS[id]={hid:false,col:false,x:0,y:0}}
  const d=defaultWins(),S0=stage.getBoundingClientRect();
  for(const[id]of WINS){
    const sv=saved&&saved[id]||null;
    WS[id]={hid:false,col:false,...d[id],...(sv||{})};
    if(sv&&!sv.side){const w=winEl(id).offsetWidth;WS[id].side=(WS[id].x+w/2>S0.width/2)?'r':'l';WS[id].ro=Math.max(8,Math.round(S0.width-WS[id].x-w))}
    const el=winEl(id),bar=el.querySelector('.win-bar');
    el.addEventListener('pointerdown',e=>{e.stopPropagation();el.style.zIndex=++winZ});
    el.addEventListener('wheel',e=>e.stopPropagation(),{passive:true});
    bar.addEventListener('click',e=>{if(e.target.closest('[data-collapse]')){WS[id].col=!WS[id].col;placeWin(id);saveUI()}});
    track(bar,e=>!e.target.closest('button')&&{x0:WS[id].x,y0:WS[id].y,sx:e.clientX,sy:e.clientY},(e,s)=>{WS[id].x=s.x0+e.clientX-s.sx;WS[id].y=s.y0+e.clientY-s.sy;delete WS[id].side;placeWin(id)},()=>{anchorWin(id);saveUI()});
  }
  if(!saved||!saved.winLayers){const d2=defaultWins();WS.winLayers.y=d2.winLayers.y}
  for(const[id]of WINS)placeWin(id);
}
const prev={scale:2,play:false,timer:null,idx:0,list:[],el:null,cv:$('#prevCv')};
function prevScale(){return Math.max(1,Math.min(prev.scale,Math.floor(240/Math.max(doc.w,doc.h))||1))}
function syncPrev(){const s=WS.winPrev;prev.el=s&&!s.hid&&!s.col?winEl('winPrev'):null;if(!prev.el&&prev.play)stopPrevPlay();if(prev.el)drawPrevNow()}
function togglePreview(on){const s=WS.winPrev;s.hid=on==null?!s.hid:!on;if(!s.hid)s.col=false;placeWin('winPrev');saveUI()}
{const bar=winEl('winPrev').querySelector('.win-bar');
  bar.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;
    if(b.dataset.a==='sc'){prev.scale=prev.scale>=4?1:prev.scale*2;b.textContent='×'+prev.scale;drawPrevNow();saveUI()}
    else if(b.dataset.a==='play'){if(WS.winPrev.col){WS.winPrev.col=false;placeWin('winPrev')}prev.play?stopPrevPlay():startPrevPlay()}});}
function drawPrevFrom(src){const c=prev.cv;if(!c)return;const s=prevScale(),w=doc.w*s,h=doc.h*s;
  if(c.width!==w||c.height!==h){c.width=w;c.height=h;c.style.width=w+'px';c.style.height=h+'px'}
  const x=c.getContext('2d');x.imageSmoothingEnabled=false;x.clearRect(0,0,w,h);x.drawImage(src,0,0,w,h)}
function drawPrevNow(f){composite(f??st.frame,pctx);drawPrevFrom(pcomp)}
function startPrevPlay(){prev.list=tagSeq(doc.tags[st.activeTag]);if(prev.list.length<2){toast('Добавь хотя бы два кадра');return}prev.play=true;prev.idx=0;setPrevBtn();const step=()=>{if(!prev.play)return;const f=prev.list[prev.idx%prev.list.length];drawPrevNow(f);prev.timer=setTimeout(()=>{prev.idx++;if(prev.idx%prev.list.length===0)prev.list=tagSeq(doc.tags[st.activeTag]);step()},doc.frames[f]?.dur||100)};step()}
function stopPrevPlay(){clearTimeout(prev.timer);prev.play=false;setPrevBtn();if(prev.el)drawPrevNow()}
function setPrevBtn(){const b=winEl('winPrev').querySelector('[data-a="play"]');b.innerHTML=icon(prev.play?'pause':'play');b.setAttribute('aria-label',prev.play?'Пауза':'Проиграть анимацию')}
setPrevBtn();
new ResizeObserver(()=>{refs.forEach(placeRef);for(const[id]of WINS)if(WS[id])placeWin(id)}).observe(stage);

sizeAux();renderPalette();renderRecent();setTool('pencil');updatePlayUI();
(async()=>{
  let ui=null;try{ui=JSON.parse(await kvGet('pixelnya:ui')||'null');if(ui){st.grid=ui.grid!==false;st.gridN=ui.gridN|0;st.gridZ=[12,16,20,24,32].includes(ui.gridZ)?ui.gridZ:20;st.bg=BGS.some(b=>b[0]===ui.bg)?ui.bg:'chk';st.tile=!!ui.tile;st.shape=ui.shape==='round'?'round':'sq';st.touch=['auto','draw','pan'].includes(ui.touch)?ui.touch:'auto';penSeen=!!ui.penSeen;prev.scale=[1,2,4].includes(ui.prevScale)?ui.prevScale:2;winEl('winPrev').querySelector('[data-a="sc"]').textContent='×'+prev.scale}}catch{}
  await loadLib();

  let loaded=false;

})();
