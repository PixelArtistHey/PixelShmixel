<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Пиксельня">
<title>Пиксельня</title>
<style>
:root{
  --bg:#E3E6EC; --panel:#F6F7F9; --panel2:#ECEEF2; --ink:#1B2130; --muted:#5D6678; --line:#CBD1DB;
  --accent:#E39A2D; --accent-ink:#1B1406; --sel:#FFF1D9; --chk1:#D3D6DD; --chk2:#EEF0F3;
  --checker:conic-gradient(var(--chk1) 25%,var(--chk2) 0 50%,var(--chk1) 0 75%,var(--chk2) 0) 0 0/8px 8px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14181F;--panel:#1E2330;--panel2:#262C3A;--ink:#E5E8EE;--muted:#8C95A7;--line:#343C4D;
  --accent:#F2B84B;--accent-ink:#1B1406;--sel:#3A321F;--chk1:#3A3F4B;--chk2:#464C59;color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{display:grid;height:100dvh;overflow:hidden;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto 1fr auto;
  grid-template-areas:"top top top" "opts opts opts" "tools stage side" "time time time";
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit}
.btn{height:40px;min-width:40px;padding:0 11px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;touch-action:manipulation;white-space:nowrap;flex:none}
.btn:focus-visible,.field:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.38;cursor:default}
.btn[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{height:32px;min-width:32px;padding:0 9px;font-size:13px;border-radius:7px}
.btn.icon{padding:0;width:40px}
.btn.small.icon{width:32px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
svg.px{width:20px;height:20px;shape-rendering:crispEdges;fill:currentColor;display:block}
.top{grid-area:top;display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin-right:6px;white-space:nowrap}
.mark{width:14px;height:14px;border-radius:2px;background:conic-gradient(var(--accent) 25%,var(--ink) 0 50%,var(--accent) 0 75%,var(--ink) 0) 0 0/14px 14px}
.sep{width:1px;height:24px;background:var(--line);margin:0 4px;flex:none}
.grow{flex:1}
.meta{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13px;display:flex;gap:12px}
#sideBtn{display:none}
.opts{grid-area:opts;display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel2);border-bottom:1px solid var(--line);min-height:46px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.opt-title{font-weight:600;margin-right:4px}
.grp{display:inline-flex;align-items:center;gap:6px}
.lbl{color:var(--muted);font-size:13px}
.val{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.hint{color:var(--muted);font-size:13px;margin:0;white-space:normal}
.tools{grid-area:tools;display:flex;flex-direction:column;gap:6px;padding:8px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto}
.tool{width:50px;height:50px;padding:0;border-radius:11px}
.tool svg.px{width:24px;height:24px}
.stage{grid-area:stage;position:relative;overflow:hidden;touch-action:none}
#view{position:absolute;inset:0;display:block;touch-action:none}
.side{grid-area:side;width:276px;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.side-head{display:flex;align-items:center;justify-content:space-between;font-size:15px;gap:8px}
#sideClose{display:none}
.colors{display:flex;gap:12px;align-items:flex-start}
.swatches{position:relative;width:66px;height:66px;flex:none}
.sw{position:absolute;width:44px;height:44px;border-radius:7px;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
.sw.pri{left:0;top:0;z-index:2}
.sw.sec{right:0;bottom:0}
.sw input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;cursor:pointer}
.colmeta{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.field{height:32px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit;padding:0 8px;-webkit-user-select:text;user-select:text;min-width:0}
#hex{width:100%;font-variant-numeric:tabular-nums}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(26px,1fr));gap:5px}
.pal{aspect-ratio:1;border-radius:5px;border:1px solid var(--line);padding:0;cursor:pointer;touch-action:manipulation}
.pal.on{outline:2px solid var(--accent);outline-offset:1px}
.row-btns{display:flex;flex-wrap:wrap;gap:6px}
.layers{display:flex;flex-direction:column;gap:4px}
.layer{display:flex;align-items:center;gap:6px;padding:3px;border-radius:9px;border:1px solid transparent}
.layer.on{background:var(--sel);border-color:var(--accent)}
.layer .eye[aria-pressed=false] svg{opacity:.28}
.lname{flex:1;height:36px;text-align:left;border:0;background:transparent;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;padding:0 6px;touch-action:manipulation}
.op{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.op input{flex:1;accent-color:var(--accent)}
.time{grid-area:time;background:var(--panel);border-top:1px solid var(--line);padding:6px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.time-row{display:flex;align-items:center;gap:6px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.time-row label{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.num{width:76px}
.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 4px;min-height:82px}
.frame{flex:none;width:66px;height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--muted);font-size:12px;padding:4px;cursor:pointer;touch-action:manipulation}
.frame canvas{image-rendering:pixelated;background:var(--checker)}
.frame.on{border:2px solid var(--accent);color:var(--ink);font-weight:600}
.modal{position:fixed;inset:0;background:rgba(10,12,18,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal[hidden]{display:none}
.sheet{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(440px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-size:18px}
.sheet label{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet p{margin:0;line-height:1.45}
.menu{display:flex;flex-direction:column;gap:6px}
.menu .btn{justify-content:flex-start}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.seg,.presets{display:flex;gap:6px;flex-wrap:wrap}
.wh{display:flex;gap:12px;flex-wrap:wrap}
.preview{display:flex;flex-direction:column;gap:10px;align-items:center;padding-top:4px;border-top:1px solid var(--line)}
.preview img{max-width:100%;max-height:260px;image-rendering:pixelated;background:var(--checker);border-radius:6px;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
.keys dt{font-weight:600;white-space:nowrap}
.keys dd{margin:0;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(130px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 14px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw;text-align:center}
.toast.show{opacity:1}
@media (max-width:860px){
  body{grid-template-columns:auto 1fr;grid-template-areas:"top top" "opts opts" "tools stage" "time time"}
  .side{position:fixed;top:0;right:0;bottom:0;z-index:40;transform:translateX(105%);transition:transform .2s;box-shadow:-8px 0 24px rgba(0,0,0,.25);padding-top:calc(12px + env(safe-area-inset-top));padding-bottom:calc(12px + env(safe-area-inset-bottom))}
  body.side-open .side{transform:none}
  #sideClose,#sideBtn{display:inline-flex}
}
@media (max-width:560px){
  .tool{width:42px;height:42px}
  .brand .name,.meta{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <span class="brand"><i class="mark"></i><span class="name">Пиксельня</span></span>
  <button class="btn" id="fileBtn">Файл</button>
  <button class="btn" id="exportBtn">Экспорт</button>
  <span class="sep"></span>
  <button class="btn icon" id="undoBtn" aria-label="Отменить" title="Отменить (⌘Z)" data-icon="undo"></button>
  <button class="btn icon" id="redoBtn" aria-label="Повторить" title="Повторить (⇧⌘Z)" data-icon="redo"></button>
  <span class="sep"></span>
  <button class="btn icon" id="zoomOut" aria-label="Отдалить">−</button>
  <button class="btn" id="zoomLbl" title="Вписать в экран">100%</button>
  <button class="btn icon" id="zoomIn" aria-label="Приблизить">+</button>
  <button class="btn" id="gridBtn" aria-pressed="true">Сетка</button>
  <span class="grow"></span>
  <span class="meta"><span id="metaSize"></span><span id="metaPos"></span></span>
  <button class="btn" id="sideBtn">Цвета и слои</button>
</header>

<div class="opts" id="opts"></div>
<nav class="tools" id="tools" aria-label="Инструменты"></nav>
<main class="stage" id="stage"><canvas id="view"></canvas></main>

<aside class="side" id="side">
  <div class="side-head"><b>Цвет</b><button class="btn small" id="sideClose">Закрыть</button></div>
  <div class="colors">
    <div class="swatches">
      <div class="sw sec" id="swSec" title="Второй цвет"><input type="color" id="colSec" aria-label="Второй цвет"></div>
      <div class="sw pri" id="swPri" title="Основной цвет"><input type="color" id="colPri" aria-label="Основной цвет"></div>
    </div>
    <div class="colmeta">
      <input id="hex" class="field" maxlength="7" spellcheck="false" autocomplete="off" aria-label="Код цвета">
      <button class="btn small" id="swapBtn" title="X">Поменять</button>
      <button class="btn small" id="addSw">В палитру</button>
    </div>
  </div>
  <div class="palette" id="palette"></div>
  <p class="hint">Нажми на цвет, чтобы выбрать. Удержи, чтобы убрать из палитры.</p>
  <div class="side-head"><b>Слои</b></div>
  <div class="row-btns">
    <button class="btn small" id="lAdd">Новый</button>
    <button class="btn small" id="lDup">Копия</button>
    <button class="btn small" id="lDel">Удалить</button>
    <button class="btn small icon" id="lUp" aria-label="Слой выше">↑</button>
    <button class="btn small icon" id="lDown" aria-label="Слой ниже">↓</button>
    <button class="btn small" id="lMerge">Слить вниз</button>
  </div>
  <div class="layers" id="layers"></div>
  <label class="op">Непрозрачность <input type="range" id="opacity" min="0" max="100"><span id="opVal"></span></label>
  <p class="hint">Нажми на выбранный слой ещё раз, чтобы переименовать.</p>
</aside>

<footer class="time">
  <div class="time-row">
    <button class="btn icon" id="playBtn" aria-label="Проиграть" title="Enter" data-icon="play"></button>
    <button class="btn" id="onionBtn" aria-pressed="false">Калька</button>
    <span class="sep"></span>
    <button class="btn small" id="fAdd">Кадр +</button>
    <button class="btn small" id="fDup">Копия</button>
    <button class="btn small" id="fDel">Удалить</button>
    <button class="btn small icon" id="fLeft" aria-label="Сдвинуть кадр влево">←</button>
    <button class="btn small icon" id="fRight" aria-label="Сдвинуть кадр вправо">→</button>
    <span class="sep"></span>
    <label>Длительность <input type="number" id="dur" class="field num" min="10" max="5000" step="10"> мс</label>
    <button class="btn small" id="durAll">Всем кадрам</button>
  </div>
  <div class="strip" id="strip"></div>
</footer>

<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="fileIn" hidden>

<script>
(()=>{
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const MAXS=512;

/* ---------- pixel icons ---------- */
const ICONS={
  pencil:["......##.",".....#..#","....#..#.","...#..#..","..#..#...",".#..#....","#.##.....","##.......","........."],
  eraser:[".........",".....###.","....#..##","...#..#.#","..#..#..#",".#####.#.",".#...##..",".#####...","........."],
  fill:["...#.....","..#.#....",".#...#...","#.....#..",".#...###.","..#.#.###","...#..###","........#","........."],
  picker:["......##.",".....####","......##.",".....#.#.","....#....","...#.....","..#......",".#.......","#........"],
  line:["........#",".......#.","......#..",".....#...","....#....","...#.....","..#......",".#.......","#........"],
  rect:["#########","#.......#","#.......#","#.......#","#.......#","#.......#","#.......#","#.......#","#########"],
  ellipse:[".........","...###...",".##...##.","#.......#","#.......#","#.......#",".##...##.","...###...","........."],
  move:["....#....","...###...","....#....",".#..#..#.","#########",".#..#..#.","....#....","...###...","....#...."],
  undo:[".........","..#......",".##......","#######..",".##....#.","..#.....#","........#",".......#.","....###.."],
  play:["..#......","..##.....","..###....","..####...","..#####..","..####...","..###....","..##.....","..#......"],
  pause:[".##...##.",".##...##.",".##...##.",".##...##.",".##...##.",".##...##.",".##...##.",".##...##.",".##...##."],
  eye:[".........",".........","...###...",".##...##.","#...#...#",".##...##.","...###...",".........","........."]
};
ICONS.redo=ICONS.undo.map(r=>[...r].reverse().join(''));
function icon(n){const rows=ICONS[n];let r='';rows.forEach((row,y)=>{for(let x=0;x<row.length;x++)if(row[x]==='#')r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`});return `<svg class="px" viewBox="0 0 ${rows[0].length} ${rows.length}" aria-hidden="true">${r}</svg>`}
document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));

const TOOLS=[
  {id:'pencil',name:'Карандаш',key:'B',code:'KeyB'},
  {id:'eraser',name:'Ластик',key:'E',code:'KeyE'},
  {id:'fill',name:'Заливка',key:'G',code:'KeyG'},
  {id:'picker',name:'Пипетка',key:'I',code:'KeyI'},
  {id:'line',name:'Линия',key:'L',code:'KeyL'},
  {id:'rect',name:'Прямоугольник',key:'U',code:'KeyU'},
  {id:'ellipse',name:'Эллипс',key:'O',code:'KeyO'},
  {id:'move',name:'Сдвиг слоя',key:'V',code:'KeyV'}
];
const DEFAULT_PAL=["#0f0f14","#2b2d42","#5c5f77","#9a9cb0","#d9dae3","#ffffff","#3b1f2b","#7a2e3a","#c2413b","#ee7a4a","#f6b26b","#fbe3a1","#1d3a2a","#2f6b3a","#5ba84a","#a6d15a","#16324f","#23629a","#3fa7d6","#9fe2f0","#3d2a5c","#6b3fa0","#b06ad1","#f0a6d8","#5a3a22","#8f5a2e","#c58b4f","#e9c28f"];

/* ---------- state ---------- */
function makeDoc(w,h){return{w,h,layers:[{name:'Слой 1',visible:true,opacity:1}],frames:[{dur:100}],cels:[[new Uint8ClampedArray(w*h*4)]]}}
let doc=makeDoc(32,32);
let palette=DEFAULT_PAL.slice();
let undoStack=[],redoStack=[];
const st={layer:0,frame:0,tool:'pencil',size:1,pp:true,mx:false,my:false,filled:false,contig:true,
  primary:[27,33,48,255],secondary:[255,255,255,255],zoom:8,panX:0,panY:0,grid:true,onion:false,playing:false,
  ex:{fmt:'png',scale:4,layout:'row',name:'sprite'}};
const cel=(l=st.layer,f=st.frame)=>doc.cels[l][f];

const comp=document.createElement('canvas'),cctx=comp.getContext('2d',{willReadFrequently:true});
const tmp=document.createElement('canvas'),tctx=tmp.getContext('2d');
const oni=document.createElement('canvas'),octx=oni.getContext('2d');
function sizeAux(){for(const c of[comp,tmp,oni]){c.width=doc.w;c.height=doc.h}}
function composite(f,ctx){
  ctx.clearRect(0,0,doc.w,doc.h);
  doc.layers.forEach((L,l)=>{if(!L.visible||L.opacity<=0)return;
    tctx.putImageData(new ImageData(doc.cels[l][f],doc.w,doc.h),0,0);
    ctx.globalAlpha=L.opacity;ctx.drawImage(tmp,0,0)});
  ctx.globalAlpha=1;
}

/* ---------- view ---------- */
const stage=$('#stage'),view=$('#view'),vctx=view.getContext('2d');
let dpr=1,VW=0,VH=0,checker=null,hover=null,rq=false;
function makeChecker(){const cs=getComputedStyle(document.documentElement);const c=document.createElement('canvas');c.width=c.height=16;const x=c.getContext('2d');x.fillStyle=cs.getPropertyValue('--chk1').trim();x.fillRect(0,0,16,16);x.fillStyle=cs.getPropertyValue('--chk2').trim();x.fillRect(0,0,8,8);x.fillRect(8,8,8,8);checker=vctx.createPattern(c,'repeat')}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{makeChecker();requestRender()});
function resize(){const r=stage.getBoundingClientRect();dpr=window.devicePixelRatio||1;VW=r.width;VH=r.height;view.width=Math.round(VW*dpr);view.height=Math.round(VH*dpr);view.style.width=VW+'px';view.style.height=VH+'px';makeChecker();requestRender()}
new ResizeObserver(resize).observe(stage);
function requestRender(){if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;render()})}
function drawTinted(f,color,alpha,x0,y0,dw,dh){composite(f,octx);octx.globalCompositeOperation='source-atop';octx.globalAlpha=.55;octx.fillStyle=color;octx.fillRect(0,0,doc.w,doc.h);octx.globalCompositeOperation='source-over';octx.globalAlpha=1;vctx.globalAlpha=alpha;vctx.drawImage(oni,x0,y0,dw,dh);vctx.globalAlpha=1}
function render(){
  vctx.setTransform(dpr,0,0,dpr,0,0);vctx.clearRect(0,0,VW,VH);
  const z=st.zoom,x0=st.panX,y0=st.panY,dw=doc.w*z,dh=doc.h*z;
  vctx.fillStyle=checker;vctx.fillRect(x0,y0,dw,dh);
  vctx.imageSmoothingEnabled=false;
  const n=doc.frames.length;
  if(st.onion&&n>1&&!st.playing){drawTinted((st.frame-1+n)%n,'#e0443a',.4,x0,y0,dw,dh);if(n>2)drawTinted((st.frame+1)%n,'#3a8de0',.3,x0,y0,dw,dh)}
  composite(st.frame,cctx);vctx.drawImage(comp,x0,y0,dw,dh);
  if(st.grid&&z>=6){
    vctx.beginPath();
    const xs=Math.max(0,Math.floor(-x0/z)),xe=Math.min(doc.w,Math.ceil((VW-x0)/z));
    const ys=Math.max(0,Math.floor(-y0/z)),ye=Math.min(doc.h,Math.ceil((VH-y0)/z));
    for(let x=xs;x<=xe;x++){const X=Math.round(x0+x*z)+.5;vctx.moveTo(X,y0);vctx.lineTo(X,y0+dh)}
    for(let y=ys;y<=ye;y++){const Y=Math.round(y0+y*z)+.5;vctx.moveTo(x0,Y);vctx.lineTo(x0+dw,Y)}
    vctx.strokeStyle='rgba(127,127,127,.28)';vctx.lineWidth=1;vctx.stroke();
  }
  vctx.strokeStyle='rgba(127,127,127,.6)';vctx.lineWidth=1;vctx.strokeRect(Math.round(x0)-.5,Math.round(y0)-.5,Math.round(dw)+1,Math.round(dh)+1);
  if(hover&&!st.playing&&!stroke?.moving){
    const s=['pencil','eraser','line','rect','ellipse'].includes(st.tool)?st.size:1,o=Math.floor((s-1)/2);
    const accent=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
    vctx.strokeStyle=accent;vctx.lineWidth=1.5;
    vctx.strokeRect(x0+(hover.x-o)*z+.75,y0+(hover.y-o)*z+.75,s*z-1.5,s*z-1.5);
  }
}
function updateZoomLabel(){$('#zoomLbl').textContent=Math.round(st.zoom*100)+'%'}
function zoomAt(z,cx,cy){z=clamp(z,.25,128);const ux=(cx-st.panX)/st.zoom,uy=(cy-st.panY)/st.zoom;st.zoom=z;st.panX=Math.round(cx-ux*z);st.panY=Math.round(cy-uy*z);updateZoomLabel();requestRender()}
const ZL=[.25,.5,1,2,3,4,6,8,10,12,16,20,24,32,48,64,96,128];
function zoomStep(d,cx=VW/2,cy=VH/2){let i=ZL.findIndex(v=>v>=st.zoom-1e-6);if(i<0)i=ZL.length-1;if(d>0)i=ZL[i]>st.zoom+1e-6?i:i+1;else i=i-1;zoomAt(ZL[clamp(i,0,ZL.length-1)],cx,cy)}
function snapZoom(cx,cy){const z=st.zoom>=1?Math.round(st.zoom):(st.zoom>=.5?.5:.25);zoomAt(z,cx,cy)}
function fitView(){const r=stage.getBoundingClientRect();let z=Math.min((r.width-32)/doc.w,(r.height-32)/doc.h);z=z>=1?Math.floor(z):(z>=.5?.5:.25);st.zoom=z;st.panX=Math.round((r.width-doc.w*z)/2);st.panY=Math.round((r.height-doc.h*z)/2);updateZoomLabel();requestRender()}

/* ---------- drawing ---------- */
function setPx(d,x,y,c){if(x<0||y<0||x>=doc.w||y>=doc.h)return;const i=(y*doc.w+x)*4;d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];d[i+3]=c[3]}
function mirrors(x,y){const p=[[x,y]];if(st.mx)p.push([doc.w-1-x,y]);if(st.my)p.push([x,doc.h-1-y]);if(st.mx&&st.my)p.push([doc.w-1-x,doc.h-1-y]);return p}
function plot(d,x,y,c){for(const[a,b]of mirrors(x,y))setPx(d,a,b,c)}
function brush(d,x,y,c){const s=st.size,o=Math.floor((s-1)/2);for(let j=0;j<s;j++)for(let i=0;i<s;i++)plot(d,x-o+i,y-o+j,c)}
function restorePx(d,b,x,y){for(const[a,c]of mirrors(x,y)){if(a<0||c<0||a>=doc.w||c>=doc.h)continue;const i=(c*doc.w+a)*4;d[i]=b[i];d[i+1]=b[i+1];d[i+2]=b[i+2];d[i+3]=b[i+3]}}
function bres(x0,y0,x1,y1,cb){let dx=Math.abs(x1-x0),sx=x0<x1?1:-1,dy=-Math.abs(y1-y0),sy=y0<y1?1:-1,err=dx+dy;for(;;){cb(x0,y0);if(x0===x1&&y0===y1)break;const e2=2*err;if(e2>=dy){err+=dy;x0+=sx}if(e2<=dx){err+=dx;y0+=sy}}}
function ellipsePts(x0,y0,x1,y1){
  const out=[],P=(x,y)=>out.push([x,y]);
  let a=Math.abs(x1-x0),b=Math.abs(y1-y0),b1=b&1,dx=4*(1-a)*b*b,dy=4*(b1+1)*a*a,err=dx+dy+b1*a*a,e2;
  if(x0>x1){x0=x1;x1+=a}if(y0>y1)y0=y1;y0+=(b+1)>>1;y1=y0-b1;a*=8*a;b1=8*b*b;
  do{P(x1,y0);P(x0,y0);P(x0,y1);P(x1,y1);e2=2*err;if(e2<=dy){y0++;y1--;err+=dy+=a}if(e2>=dx||2*err>dy){x0++;x1--;err+=dx+=b1}}while(x0<=x1);
  while(y0-y1<=b){P(x0-1,y0);P(x1+1,y0++);P(x0-1,y1);P(x1+1,y1--)}
  return out;
}
function floodFill(d,x,y,c){
  const w=doc.w,h=doc.h;if(x<0||y<0||x>=w||y>=h)return;
  const i0=(y*w+x)*4,t=[d[i0],d[i0+1],d[i0+2],d[i0+3]];
  const same=i=>t[3]===0?d[i+3]===0:(d[i]===t[0]&&d[i+1]===t[1]&&d[i+2]===t[2]&&d[i+3]===t[3]);
  if(t[3]===0&&c[3]===0)return;if(t[0]===c[0]&&t[1]===c[1]&&t[2]===c[2]&&t[3]===c[3])return;
  const set=i=>{d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];d[i+3]=c[3]};
  if(!st.contig){const m=[];for(let i=0;i<d.length;i+=4)if(same(i))m.push(i);m.forEach(set);return}
  const seen=new Uint8Array(w*h),stack=[x,y];
  while(stack.length){const py=stack.pop(),px=stack.pop();if(px<0||py<0||px>=w||py>=h)continue;const p=py*w+px;if(seen[p])continue;seen[p]=1;const i=p*4;if(!same(i))continue;set(i);stack.push(px+1,py,px-1,py,px,py+1,px,py-1)}
}

let stroke=null;
function beginStroke(x,y,pointerId,ptype,opts){
  if(st.playing)stopPlay();
  const tool=opts.pick?'picker':st.tool;
  if(tool==='picker'){stroke={tool,pointerId,ptype,secondary:opts.secondary};pickAt(x,y,opts.secondary);return}
  if(!doc.layers[st.layer].visible){toast('Слой скрыт. Включи его, чтобы рисовать');return}
  const d=cel(),before=d.slice();
  const color=tool==='eraser'?[0,0,0,0]:(opts.secondary?st.secondary:st.primary).slice();
  stroke={tool,pointerId,ptype,l:st.layer,f:st.frame,before,color,start:[x,y],last:[x,y],pts:[[x,y]],moving:tool==='move'};
  if(tool==='pencil'||tool==='eraser')brush(d,x,y,color);
  else if(tool==='fill')floodFill(d,x,y,color);
  else shapeUpdate(x,y);
  changed();
}
function addPoint(d,x,y){
  const s=stroke,pts=s.pts,lp=pts[pts.length-1];if(lp[0]===x&&lp[1]===y)return;
  pts.push([x,y]);brush(d,x,y,s.color);
  if(st.pp&&st.size===1&&pts.length>=3){const a=pts[pts.length-3],b=pts[pts.length-2],c=pts[pts.length-1];
    if(Math.abs(a[0]-c[0])===1&&Math.abs(a[1]-c[1])===1&&(b[0]===a[0]||b[1]===a[1])&&(b[0]===c[0]||b[1]===c[1])){restorePx(d,s.before,b[0],b[1]);pts.splice(pts.length-2,1)}}
}
function strokeMove(x,y){
  if(!stroke)return;
  if(stroke.tool==='picker'){pickAt(x,y,stroke.secondary);return}
  const d=cel(stroke.l,stroke.f);
  if(stroke.tool==='pencil'||stroke.tool==='eraser'){const[lx,ly]=stroke.last;if(lx===x&&ly===y)return;bres(lx,ly,x,y,(px,py)=>addPoint(d,px,py));stroke.last=[x,y]}
  else if(stroke.tool!=='fill')shapeUpdate(x,y);
  changed();
}
function shapeUpdate(x,y){
  const s=stroke,d=cel(s.l,s.f),[sx,sy]=s.start,c=s.color;d.set(s.before);
  if(s.tool==='line')bres(sx,sy,x,y,(px,py)=>brush(d,px,py,c));
  else if(s.tool==='rect'){const x0=Math.min(sx,x),x1=Math.max(sx,x),y0=Math.min(sy,y),y1=Math.max(sy,y);
    if(st.filled){for(let yy=y0;yy<=y1;yy++)for(let xx=x0;xx<=x1;xx++)plot(d,xx,yy,c)}
    else{for(let xx=x0;xx<=x1;xx++){brush(d,xx,y0,c);brush(d,xx,y1,c)}for(let yy=y0;yy<=y1;yy++){brush(d,x0,yy,c);brush(d,x1,yy,c)}}}
  else if(s.tool==='ellipse'){const pts=ellipsePts(sx,sy,x,y);
    if(st.filled){const rows=new Map();for(const[px,py]of pts){const r=rows.get(py);if(!r)rows.set(py,[px,px]);else{r[0]=Math.min(r[0],px);r[1]=Math.max(r[1],px)}}for(const[py,[a,b]]of rows)for(let px=a;px<=b;px++)plot(d,px,py,c)}
    else for(const[px,py]of pts)brush(d,px,py,c)}
  else if(s.tool==='move'){const dx=x-sx,dy=y-sy,w=doc.w,h=doc.h,b=s.before;d.fill(0);
    for(let yy=0;yy<h;yy++){const ty=yy+dy;if(ty<0||ty>=h)continue;for(let xx=0;xx<w;xx++){const tx=xx+dx;if(tx<0||tx>=w)continue;const si=(yy*w+xx)*4,di=(ty*w+tx)*4;d[di]=b[si];d[di+1]=b[si+1];d[di+2]=b[si+2];d[di+3]=b[si+3]}}}
}
function sameArr(a,b){for(let i=0;i<a.length;i++)if(a[i]!==b[i])return false;return true}
function endStroke(){
  if(!stroke)return;const s=stroke;stroke=null;
  if(s.before){const d=cel(s.l,s.f);if(!sameArr(d,s.before))pushUndo({type:'cel',l:s.l,f:s.f,before:s.before,after:d.slice()})}
  changed(true);
}
function cancelStroke(){if(!stroke)return;if(stroke.before)cel(stroke.l,stroke.f).set(stroke.before);stroke=null;changed(true)}
function pickAt(x,y,secondary){
  if(x<0||y<0||x>=doc.w||y>=doc.h)return;composite(st.frame,cctx);
  const p=cctx.getImageData(x,y,1,1).data;if(p[3]===0)return;
  const c=[p[0],p[1],p[2],255];if(secondary)st.secondary=c;else st.primary=c;updateColorUI();
}

/* ---------- undo ---------- */
function snap(){return{w:doc.w,h:doc.h,layers:doc.layers.map(l=>({...l})),frames:doc.frames.map(f=>({...f})),cels:doc.cels.map(r=>r.map(c=>c.slice())),layer:st.layer,frame:st.frame}}
function restoreSnap(s){const resized=s.w!==doc.w||s.h!==doc.h;doc={w:s.w,h:s.h,layers:s.layers.map(l=>({...l})),frames:s.frames.map(f=>({...f})),cels:s.cels.map(r=>r.map(c=>c.slice()))};st.layer=s.layer;st.frame=s.frame;sizeAux();if(resized)fitView()}
function pushUndo(e){undoStack.push(e);if(undoStack.length>80)undoStack.shift();redoStack.length=0;updateUndoUI()}
function docOp(fn){if(st.playing)stopPlay();const before=snap();fn();pushUndo({type:'doc',before,after:snap()});structureChanged()}
function applyEntry(e,which){if(e.type==='cel'){doc.cels[e.l][e.f].set(e[which]);st.layer=e.l;st.frame=e.f}else restoreSnap(e[which]);structureChanged()}
function undo(){if(stroke)return;const e=undoStack.pop();if(!e){toast('Отменять нечего');return}applyEntry(e,'before');redoStack.push(e);updateUndoUI()}
function redo(){if(stroke)return;const e=redoStack.pop();if(!e)return;applyEntry(e,'after');undoStack.push(e);updateUndoUI()}
function updateUndoUI(){$('#undoBtn').disabled=!undoStack.length;$('#redoBtn').disabled=!redoStack.length}

/* ---------- change propagation ---------- */
let thumbTimer=null;
function changed(final){requestRender();const f=stroke?stroke.f:st.frame;if(final){drawThumb(f);scheduleAutosave()}else if(!thumbTimer)thumbTimer=setTimeout(()=>{thumbTimer=null;drawThumb(f)},120)}
function structureChanged(){st.layer=clamp(st.layer,0,doc.layers.length-1);st.frame=clamp(st.frame,0,doc.frames.length-1);renderLayers();renderFrames();frameSelected();updateUndoUI();updateMeta();requestRender();scheduleAutosave()}
function updateMeta(){$('#metaSize').textContent=`${doc.w}×${doc.h}`;$('#metaPos').textContent=hover&&hover.x>=0&&hover.y>=0&&hover.x<doc.w&&hover.y<doc.h?`${hover.x}, ${hover.y}`:''}

/* ---------- tools UI ---------- */
const toolsEl=$('#tools');
TOOLS.forEach(t=>{const b=document.createElement('button');b.className='btn tool';b.dataset.tool=t.id;b.setAttribute('aria-label',t.name);b.title=`${t.name} (${t.key})`;b.innerHTML=icon(t.id);b.onclick=()=>setTool(t.id);toolsEl.append(b)});
function setTool(id){st.tool=id;toolsEl.querySelectorAll('.tool').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tool===id));renderOptions();requestRender()}
function setSize(n){st.size=clamp(n,1,32);const v=$('#sizeVal');if(v)v.textContent=st.size;requestRender()}
function renderOptions(){
  const t=st.tool,T=TOOLS.find(x=>x.id===t);let h=`<span class="opt-title">${T.name}</span>`;
  const chip=(k,label)=>`<button class="btn small" data-chip="${k}" aria-pressed="${st[k]}">${label}</button>`;
  if(['pencil','eraser','line','rect','ellipse'].includes(t))h+=`<span class="grp"><span class="lbl">Размер</span><button class="btn small icon" data-act="size-" aria-label="Меньше">−</button><span class="val" id="sizeVal">${st.size}</span><button class="btn small icon" data-act="size+" aria-label="Больше">+</button></span>`;
  if(t==='pencil'||t==='eraser')h+=chip('pp','Пиксель-перфект');
  if(t==='rect'||t==='ellipse')h+=chip('filled','С заливкой');
  if(t==='fill')h+=chip('contig','Только смежные');
  if(['pencil','eraser','line','rect','ellipse'].includes(t))h+=chip('mx','Зеркало ↔')+chip('my','Зеркало ↕');
  if(t==='picker')h+=`<p class="hint">Берёт цвет с холста. С клавиатурой: удерживай Alt с любым инструментом.</p>`;
  if(t==='move')h+=`<p class="hint">Сдвигает текущий слой в этом кадре.</p>`;
  $('#opts').innerHTML=h;
}
$('#opts').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.act==='size-')setSize(st.size-1);else if(b.dataset.act==='size+')setSize(st.size+1);
  else if(b.dataset.chip){const k=b.dataset.chip;st[k]=!st[k];b.setAttribute('aria-pressed',st[k])}});

/* ---------- colors & palette ---------- */
const hexOf=c=>'#'+c.slice(0,3).map(v=>v.toString(16).padStart(2,'0')).join('');
const rgbOf=h=>{const m=/^#?([0-9a-f]{6})$/i.exec(String(h).trim());if(!m)return null;const n=parseInt(m[1],16);return[n>>16&255,n>>8&255,n&255,255]};
function updateColorUI(){const p=hexOf(st.primary),s=hexOf(st.secondary);$('#swPri').style.background=p;$('#swSec').style.background=s;$('#colPri').value=p;$('#colSec').value=s;if(document.activeElement!==$('#hex'))$('#hex').value=p;
  document.querySelectorAll('.pal').forEach(el=>el.classList.toggle('on',el.dataset.c===p))}
$('#colPri').addEventListener('input',e=>{st.primary=rgbOf(e.target.value);updateColorUI()});
$('#colSec').addEventListener('input',e=>{st.secondary=rgbOf(e.target.value);updateColorUI()});
$('#hex').addEventListener('input',e=>{const c=rgbOf(e.target.value);if(c){st.primary=c;updateColorUI()}});
$('#hex').addEventListener('blur',updateColorUI);
function swapColors(){[st.primary,st.secondary]=[st.secondary,st.primary];updateColorUI()}
$('#swapBtn').onclick=swapColors;
$('#addSw').onclick=()=>{const h=hexOf(st.primary);if(palette.includes(h)){toast('Этот цвет уже в палитре');return}palette.push(h);renderPalette();scheduleAutosave()};
function renderPalette(){
  const box=$('#palette');box.innerHTML='';
  palette.forEach((h,i)=>{const b=document.createElement('button');b.className='pal';b.style.background=h;b.dataset.c=h;b.setAttribute('aria-label',h);
    let timer=null;
    b.addEventListener('pointerdown',()=>{timer=setTimeout(()=>{timer=null;palette.splice(i,1);renderPalette();scheduleAutosave();toast('Цвет убран из палитры')},550)});
    const cancel=()=>{if(timer){clearTimeout(timer);timer=null}};
    b.addEventListener('pointerup',()=>{if(timer){cancel();st.primary=rgbOf(h);updateColorUI()}});
    b.addEventListener('pointerleave',cancel);b.addEventListener('pointercancel',cancel);
    b.addEventListener('contextmenu',e=>e.preventDefault());
    box.append(b)});
  updateColorUI();
}

/* ---------- layers ---------- */
function renderLayers(){
  const box=$('#layers');box.innerHTML='';
  for(let l=doc.layers.length-1;l>=0;l--){const L=doc.layers[l];
    const row=document.createElement('div');row.className='layer'+(l===st.layer?' on':'');
    const eye=document.createElement('button');eye.className='btn small icon eye';eye.innerHTML=icon('eye');eye.setAttribute('aria-pressed',L.visible);eye.setAttribute('aria-label',L.visible?'Скрыть слой':'Показать слой');
    eye.onclick=()=>{L.visible=!L.visible;renderLayers();requestRender();drawAllThumbs();scheduleAutosave()};
    const name=document.createElement('button');name.className='lname';name.textContent=L.name;
    name.onclick=()=>{if(st.layer===l){askText('Имя слоя',L.name,v=>{L.name=v.trim()||L.name;renderLayers();scheduleAutosave()})}else{st.layer=l;renderLayers()}};
    row.append(eye,name);box.append(row)}
  const L=doc.layers[st.layer];$('#opacity').value=Math.round(L.opacity*100);$('#opVal').textContent=Math.round(L.opacity*100)+'%';
}
$('#opacity').addEventListener('input',e=>{doc.layers[st.layer].opacity=e.target.value/100;$('#opVal').textContent=e.target.value+'%';requestRender();clearTimeout(thumbTimer);thumbTimer=setTimeout(()=>{thumbTimer=null;drawAllThumbs()},150);scheduleAutosave()});
const blankCel=()=>new Uint8ClampedArray(doc.w*doc.h*4);
$('#lAdd').onclick=()=>docOp(()=>{const i=st.layer+1;doc.layers.splice(i,0,{name:`Слой ${doc.layers.length+1}`,visible:true,opacity:1});doc.cels.splice(i,0,doc.frames.map(blankCel));st.layer=i});
$('#lDup').onclick=()=>docOp(()=>{const i=st.layer+1,L=doc.layers[st.layer];doc.layers.splice(i,0,{...L,name:L.name+' копия'});doc.cels.splice(i,0,doc.cels[st.layer].map(c=>c.slice()));st.layer=i});
$('#lDel').onclick=()=>{if(doc.layers.length<2){toast('Нужен хотя бы один слой');return}docOp(()=>{doc.layers.splice(st.layer,1);doc.cels.splice(st.layer,1);st.layer=Math.max(0,st.layer-1)})};
function moveLayer(d){const a=st.layer,b=a+d;if(b<0||b>=doc.layers.length)return;docOp(()=>{[doc.layers[a],doc.layers[b]]=[doc.layers[b],doc.layers[a]];[doc.cels[a],doc.cels[b]]=[doc.cels[b],doc.cels[a]];st.layer=b})}
$('#lUp').onclick=()=>moveLayer(1);$('#lDown').onclick=()=>moveLayer(-1);
$('#lMerge').onclick=()=>{const u=st.layer;if(u===0){toast('Под этим слоем ничего нет');return}
  docOp(()=>{const lo=u-1,LU=doc.layers[u],LL=doc.layers[lo];const c=document.createElement('canvas');c.width=doc.w;c.height=doc.h;const x=c.getContext('2d',{willReadFrequently:true});
    for(let f=0;f<doc.frames.length;f++){x.clearRect(0,0,doc.w,doc.h);
      tctx.putImageData(new ImageData(doc.cels[lo][f],doc.w,doc.h),0,0);x.globalAlpha=LL.opacity;x.drawImage(tmp,0,0);
      if(LU.visible){tctx.putImageData(new ImageData(doc.cels[u][f],doc.w,doc.h),0,0);x.globalAlpha=LU.opacity;x.drawImage(tmp,0,0)}
      x.globalAlpha=1;doc.cels[lo][f]=new Uint8ClampedArray(x.getImageData(0,0,doc.w,doc.h).data)}
    LL.opacity=1;doc.layers.splice(u,1);doc.cels.splice(u,1);st.layer=lo})};

/* ---------- frames ---------- */
let thumbs=[];
function renderFrames(){
  const strip=$('#strip');strip.innerHTML='';thumbs=[];

  doc.frames.forEach((F,f)=>{const b=document.createElement('button');b.className='frame';b.setAttribute('aria-label',`Кадр ${f+1}`);
    const c=document.createElement('canvas');c.width=doc.w;c.height=doc.h;c.style.width=Math.max(1,doc.w*s)+'px';c.style.height=Math.max(1,doc.h*s)+'px';

}

  $('#dur').value=doc.frames[st.frame].dur;requestRender();if(!st.playing)kids[st.frame]?.scrollIntoView({inline:'nearest',block:'nearest'})}
function goFrame(d){if(st.playing)stopPlay();st.frame=(st.frame+d+doc.frames.length)%doc.frames.length;frameSelected()}
$('#fAdd').onclick=()=>docOp(()=>{const i=st.frame+1;doc.frames.splice(i,0,{dur:doc.frames[st.frame].dur});doc.cels.forEach(r=>r.splice(i,0,blankCel()));st.frame=i});
$('#fDup').onclick=()=>docOp(()=>{const i=st.frame+1;doc.frames.splice(i,0,{...doc.frames[st.frame]});doc.cels.forEach(r=>r.splice(i,0,r[st.frame].slice()));st.frame=i});
$('#fDel').onclick=()=>{if(doc.frames.length<2){toast('Нужен хотя бы один кадр');return}docOp(()=>{doc.frames.splice(st.frame,1);doc.cels.forEach(r=>r.splice(st.frame,1));st.frame=Math.max(0,st.frame-1)})};
function moveFrame(d){const a=st.frame,b=a+d;if(b<0||b>=doc.frames.length)return;docOp(()=>{[doc.frames[a],doc.frames[b]]=[doc.frames[b],doc.frames[a]];doc.cels.forEach(r=>{[r[a],r[b]]=[r[b],r[a]]});st.frame=b})}
$('#fLeft').onclick=()=>moveFrame(-1);$('#fRight').onclick=()=>moveFrame(1);
$('#dur').addEventListener('change',e=>{doc.frames[st.frame].dur=clamp(Math.round(+e.target.value)||100,10,5000);e.target.value=doc.frames[st.frame].dur;scheduleAutosave()});
$('#durAll').onclick=()=>{const v=doc.frames[st.frame].dur;doc.frames.forEach(F=>F.dur=v);toast(`Всем кадрам: ${v} мс`);scheduleAutosave()};
$('#onionBtn').onclick=e=>{st.onion=!st.onion;e.currentTarget.setAttribute('aria-pressed',st.onion);requestRender()};

  $('#exScale').onchange=e=>{st.ex.scale=+e.target.value;$('#exOut').innerHTML=''};
  $('#exLayout').onchange=e=>{st.ex.layout=e.target.value;$('#exOut').innerHTML=''};
  $('#exName').oninput=e=>{st.ex.name=e.target.value};
  $('#exGo').onclick=async()=>{const btn=$('#exGo');btn.disabled=true;btn.textContent='Готовлю…';
    try{const[blob,name]=await buildExport();await offerFile(blob,name,true)}catch(err){toast('Экспорт не удался')}
    if($('#exGo')){btn.disabled=false;btn.textContent='Экспортировать'}};
  sync();
};

/* ---------- autosave (only inside Claude artifacts) ---------- */
const store=window.storage;let saveTimer=null;
function scheduleAutosave(){if(!store)return;clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{try{await store.set('pixelnya:project',JSON.stringify(serialize()),false)}catch{}},1500)}

/* ---------- start ---------- */
sizeAux();setTool('pencil');renderPalette();updatePlayUI();
(async()=>{
  if(store){try{const r=await store.get('pixelnya:project',false);if(r&&r.value)applyProject(JSON.parse(r.value))}catch{}}
  renderPalette();structureChanged();requestAnimationFrame(()=>{resize();fitView()});
})();
})();
</script>
